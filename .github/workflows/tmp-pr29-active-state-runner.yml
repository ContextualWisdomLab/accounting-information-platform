name: Temporary PR29 active-state runner

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-active-state-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: fix/reconciliation-multi-match-conservation
          fetch-depth: 0
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked repository dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Apply already-reviewed repair transformation
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/tmp-pr29-active-state-repair.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Normalize authoritative close-package state repair\n        shell: python\n        run: |\n'
          end_marker = '      - name: Run focused provenance tests\n'
          if start_marker not in helper or end_marker not in helper:
              raise SystemExit('temporary repair transformation anchors are missing')
          block = helper.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, 'pr29-active-state-repair', 'exec'), {'__name__': '__main__'})
      - name: Run focused close-package tests
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_reconciliation_close_package_approval_provenance_red.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_close_package_cutoff_binding_red.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_close_package_equation_red.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_close_package_red.py' -v
      - name: Commit normalized product repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/adr/0056-reconciliation-close-package-provenance.md \
            src/accounting_information_platform/reconciliation_close_package.py \
            tests/test_reconciliation_close_package_approval_provenance_red.py \
            tests/test_reconciliation_close_package_cutoff_binding_red.py \
            tests/test_reconciliation_close_package_equation_red.py \
            tests/test_reconciliation_close_package_red.py \
            tests/test_reconciliation_close_package_active_state_postgres.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'repair produced no staged product changes'; exit 1; }
          git commit -m "fix: bind close packages to authoritative match state"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
