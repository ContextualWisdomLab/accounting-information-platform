name: Temporary PR29 helper bootstrap fix

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-helper-bootstrap-fix.yml

permissions:
  contents: write

jobs:
  normalize-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          fetch-depth: 2
      - name: Verify single-writer parent
        shell: bash
        env:
          EXPECTED_PARENT: 07b36f7c130aafb26379ccca4dc8185f8b98e5a6
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
      - name: Repair helper bootstrap and normalize temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/tmp-pr29-database-population-green.yml')
          text = helper.read_text(encoding='utf-8')
          old_guard = 'test "$(git rev-parse HEAD^)" = "4ac3f58c6fbab1589e5f3ec69a691c92bfa16353"'
          new_guard = f'test "$(git rev-parse HEAD^)" = "{Path(".git/refs/heads/fix/reconciliation-multi-match-conservation").read_text(encoding="utf-8").strip()}"'
          if old_guard not in text:
              raise SystemExit('temporary helper parent guard changed')
          text = text.replace(old_guard, new_guard, 1)
          old_install = '''      - name: Install focused test dependencies\n        run: python -m pip install -e .\n'''
          new_install = '''      - name: Install pinned Python\n        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97\n        with:\n          python-version: "3.13"\n          cache: pip\n          cache-dependency-path: requirements-quality.txt\n      - name: Install hash-locked focused test dependencies\n        run: >-\n          python -m pip install --require-hashes\n          --disable-pip-version-check\n          --only-binary=:all:\n          -r requirements-quality.txt\n'''
          if old_install not in text:
              raise SystemExit('temporary helper install boundary changed')
          text = text.replace(old_install, new_install, 1)
          helper.write_text(text, encoding='utf-8')
          Path('.github/workflows/tmp-pr29-helper-bootstrap-fix.yml').unlink()
          PY
          git diff --check
          git diff --exit-code -- .github/workflows/tmp-pr29-database-population-green.yml >/dev/null && exit 1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-pr29-database-population-green.yml .github/workflows/tmp-pr29-helper-bootstrap-fix.yml
          git commit -m "ci: align PR29 repair helper with pinned Python"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
