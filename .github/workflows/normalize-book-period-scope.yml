name: Normalize book-period close scope

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: normalize-book-period-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      RED_HEAD: cb6d33090eca8dfba78b32f1d99b48f355081f8f
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact repair trigger head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact trigger and one-shot diff boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git merge-base --is-ancestor "$RED_HEAD" "$TRIGGER_SHA"
          unexpected="$({ git diff --name-only "$RED_HEAD" "$TRIGGER_SHA"; } | grep -Ev '^(scripts/repair_accounting_book_period_scope.py|\.github/workflows/normalize-book-period-scope.yml)$' || true)"
          test -z "$unexpected" || { printf 'unexpected files after RED head:\n%s\n' "$unexpected"; exit 1; }
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Prove accounting-book close-isolation RED first
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest \
            tests.test_period_close_book_scope.PostgresBookPeriodIsolationTests.test_soft_close_one_book_does_not_block_sibling_book_posting \
            -v > "${RUNNER_TEMP}/book-period-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/book-period-red.log"
          test "$status" -ne 0
          grep -F "Fiscal period 2026-08 is soft_closed" "${RUNNER_TEMP}/book-period-red.log"
      - name: Apply narrow accounting-book period repair
        run: python scripts/repair_accounting_book_period_scope.py
      - name: Normalize generated coverage-test string literal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_book_period_helper_boundaries.py")
          text = path.read_text(encoding="utf-8")
          broken = 'write_text("-- test fixture\n", encoding="utf-8")'
          fixed = 'write_text("-- test fixture\\n", encoding="utf-8")'
          count = text.count(broken)
          if count != 1:
              raise SystemExit(f"generated fixture literal: expected 1 broken boundary, found {count}")
          path.write_text(text.replace(broken, fixed, 1), encoding="utf-8")
          PY
      - name: Remove one-shot repair machinery before product validation
        run: |
          rm scripts/repair_accounting_book_period_scope.py
          rm .github/workflows/normalize-book-period-scope.yml
      - name: Run repaired PostgreSQL boundary
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest
          tests.test_period_close_book_scope.PostgresBookPeriodIsolationTests.test_soft_close_one_book_does_not_block_sibling_book_posting
          -v
      - name: Run complete behavior and PostgreSQL suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Show repaired persistence coverage boundaries
        shell: bash
        run: |
          set -euo pipefail
          for range in 4450,4520 4521,4570 4730,4785 4800,4850 5575,5620 6240,6290; do
            start="${range%,*}"
            end="${range#*,}"
            printf '\n--- persistence.py:%s-%s ---\n' "$start" "$end"
            nl -ba src/accounting_information_platform/persistence.py | sed -n "${start},${end}p"
          done
      - name: Enforce 100 percent statement and branch coverage
        run: python -m coverage report --fail-under=100 --show-missing
      - name: Validate repository contracts and compilation
        run: |
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Verify normalized diff and publish canonical branch repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/repair_accounting_book_period_scope.py
          test ! -e .github/workflows/normalize-book-period-scope.yml
          git diff --check
          git status --short
          git fetch --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse "refs/remotes/origin/${HEAD_REF}")" = "$TRIGGER_SHA"
          git config user.name "accounting-foundation-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no normalized changes'; exit 1; }
          git commit -m "fix: scope fiscal-period close by accounting book"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
