name: Repair current PR 2 accounting failures

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: repair-pr2-current-head
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/accounting-posting-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      REPAIR_SOURCE_SHA: aff2c00bbfab924742c869f236f442293feb35e2
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact triggering checkout
        run: test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Materialize pinned repair modules
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/accounting-pr2-ledger-invariants
          git cat-file -e "${REPAIR_SOURCE_SHA}^{commit}"
          for script in \
            repair_pr2_command_idempotency.py \
            repair_pr2_current_failures.py \
            repair_pr2_all.py \
            repair_pr2_reversal_temporal_order.py \
            repair_pr2_followup_adjustments.py \
            repair_pr2_home_tax_replay_outcome.py \
            repair_pr2_home_tax_command_boundary.py \
            repair_pr2_close_binder_regression.py \
            repair_pr2_database_immutability.py \
            repair_pr2_force_rls.py \
            repair_pr2_runtime_tenant_binding.py \
            repair_pr2_purpose_limited_database_urls.py \
            repair_pr2_runtime_grant_regression.py \
            repair_pr2_period_state_boundary.py
          do
            git show "${REPAIR_SOURCE_SHA}:scripts/${script}" > "/tmp/${script}"
          done
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Add database authority RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          def load(name: str):
              path = Path('/tmp') / f'{name}.py'
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f'unable to load {name}')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          immutability = load('repair_pr2_database_immutability')
          force_rls = load('repair_pr2_force_rls')
          runtime = load('repair_pr2_runtime_tenant_binding')
          period_state = load('repair_pr2_period_state_boundary')

          immutability.add_database_immutability_regressions()
          force_rls.add_force_rls_regression()
          runtime._ensure_test_imports()
          runtime.add_runtime_identity_regression()
          period_state.add_runtime_regression()
          PY
      - name: Prove database authority regressions are RED
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            test_database_rejects_posted_journal_update \
            test_database_forces_rls_on_tenant_scoped_tables \
            test_real_runtime_login_is_tenant_bound_and_cannot_bypass_controls
          do
            if python -m unittest \
              "tests.test_postgres_posting.PostgresPostingTests.${test_name}" -v
            then
              echo "${test_name} unexpectedly passed before its implementation"
              exit 1
            fi
          done
      - name: Apply current command and database authority repairs
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/repair_pr2_current_failures.py
          python /tmp/repair_pr2_home_tax_command_boundary.py
          python /tmp/repair_pr2_close_binder_regression.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          def load(name: str):
              path = Path('/tmp') / f'{name}.py'
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f'unable to load {name}')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          immutability = load('repair_pr2_database_immutability')
          force_rls = load('repair_pr2_force_rls')
          runtime = load('repair_pr2_runtime_tenant_binding')
          period_state = load('repair_pr2_period_state_boundary')

          immutability.add_database_immutability_guards()
          immutability.update_immutability_documentation()
          force_rls.add_force_rls_migration()
          force_rls.apply_force_rls_migration()
          force_rls.update_security_docs()
          runtime.add_runtime_tenant_binding_migration()
          runtime.extend_foundation_installer()
          runtime.update_docs()
          period_state.enforce_initial_period_state()
          period_state.update_docs()
          PY
          python /tmp/repair_pr2_purpose_limited_database_urls.py
          python /tmp/repair_pr2_runtime_grant_regression.py
      - name: Run behavior and PostgreSQL integration tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce coverage, contracts, and compilation
        run: |
          set -euo pipefail
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Publish only if canonical branch is unchanged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/accounting-posting-foundation
          test "$(git rev-parse origin/agent/accounting-posting-foundation)" = "$TRIGGER_SHA"
          rm .github/workflows/repair-pr2-ledger-invariants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: close current accounting foundation failures"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/accounting-posting-foundation
