name: Verify remaining PR 2 accounting invariants

on:
  push:
    branches:
      - agent/accounting-posting-foundation

permissions:
  contents: read

concurrency:
  group: verify-pr2-ledger-invariants-current-head
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      REPAIR_SOURCE_SHA: 42885b53deb5325bd8d31fa43a819814969983bd
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/accounting-posting-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Materialize pinned repair scripts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/accounting-pr2-ledger-invariants
          git cat-file -e "${REPAIR_SOURCE_SHA}^{commit}"
          for script in \
            repair_pr2_ledger_invariants.py \
            repair_pr2_command_idempotency.py \
            repair_pr2_followup_adjustments.py
          do
            git show "${REPAIR_SOURCE_SHA}:scripts/${script}" > "/tmp/${script}"
          done
      - name: Apply exact review repairs
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "repair_pr2_ledger_invariants",
              "/tmp/repair_pr2_ledger_invariants.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load PR2 ledger repair module")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.replace_period_guard_migration()
          module.add_database_regression_tests()
          module.update_documentation()
          PY
          python /tmp/repair_pr2_command_idempotency.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/accounting_information_platform/accept.py")
          text = path.read_text(encoding="utf-8")
          premature = (
              "    reversal_idempotency_key = str(\n"
              "        payload.get(\"reversal_idempotency_key\") or f\"reversal:{journal_reference}\"\n"
              "    ).strip()\n"
              "    if not reversal_idempotency_key:\n"
              "        raise AccountingValidationError(\n"
              "            \"reversal_idempotency_key must not be empty\"\n"
              "        )\n"
              "    ledger = PostgresPostingLedger(database_url, tenant_reference)\n"
          )
          if premature not in text:
              raise SystemExit("reversal idempotency resolution anchor drifted")
          text = text.replace(
              premature,
              "    ledger = PostgresPostingLedger(database_url, tenant_reference)\n",
              1,
          )
          anchor = (
              "        journal_reference = resolved_reference\n"
              "    policy = ledger.load_reversal_policy(journal_reference, reversal_date)\n"
          )
          replacement = (
              "        journal_reference = resolved_reference\n"
              "    reversal_idempotency_key = str(\n"
              "        payload.get(\"reversal_idempotency_key\") or f\"reversal:{journal_reference}\"\n"
              "    ).strip()\n"
              "    if not reversal_idempotency_key:\n"
              "        raise AccountingValidationError(\n"
              "            \"reversal_idempotency_key must not be empty\"\n"
              "        )\n"
              "    policy = ledger.load_reversal_policy(journal_reference, reversal_date)\n"
          )
          if anchor not in text:
              raise SystemExit("resolved reversal idempotency anchor drifted")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "repair_pr2_followup_adjustments",
              "/tmp/repair_pr2_followup_adjustments.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load PR2 follow-up repair module")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.retain_tenant_defense_on_reversal_cache()
          module.harden_home_tax_projection()
          module.normalize_trigger_and_test_cleanup()
          PY
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_postgres_posting.py")
          text = path.read_text(encoding="utf-8")
          migration_anchor = "        apply_foundation_migration(DATABASE_URL, MIGRATION_PATH)\n"
          migration_replacement = migration_anchor + '''        with psycopg.connect(DATABASE_URL, autocommit=True) as connection:
            runtime_role = connection.execute("SELECT current_user").fetchone()[0]
            connection.execute(
                sql.SQL("GRANT accounting_closing_writer TO {}").format(
                    sql.Identifier(runtime_role)
                )
            )
'''
          if text.count(migration_anchor) != 1:
              raise SystemExit("PostgreSQL test migration anchor drifted")
          text = text.replace(migration_anchor, migration_replacement, 1)
          start = text.index("    def _raw_insert_general_journal(")
          end = text.index("    def _close_period(", start)
          helper = text[start:end]
          commit_anchor = "            connection.commit()\n"
          if helper.count(commit_anchor) != 1:
              raise SystemExit("raw journal helper commit anchor drifted")
          balanced_lines = '''            journal_id = connection.execute(
                """
                SELECT general_journal_id
                FROM accounting_core.general_journal
                WHERE tenant_account_id = %s AND journal_reference = %s
                """,
                (self.tenant_id, journal_reference),
            ).fetchone()[0]
            account_ids = dict(
                connection.execute(
                    """
                    SELECT chart_account_code, chart_account_id
                    FROM accounting_core.chart_account
                    WHERE tenant_account_id = %s
                      AND chart_account_code IN ('110100', '410100')
                      AND valid_to IS NULL
                    """,
                    (self.tenant_id,),
                ).fetchall()
            )
            for line_number, account_code, role_code, debit_amount, credit_amount in (
                (1, "110100", "accounts_receivable", Decimal("1"), Decimal("0")),
                (2, "410100", "usage_revenue", Decimal("0"), Decimal("1")),
            ):
                connection.execute(
                    """
                    INSERT INTO accounting_core.journal_entry_line (
                        tenant_account_id, general_journal_id, line_number,
                        chart_account_id, account_role_code, debit_amount, credit_amount
                    )
                    VALUES (%s, %s, %s, %s, %s, %s, %s)
                    """,
                    (
                        self.tenant_id,
                        journal_id,
                        line_number,
                        account_ids[account_code],
                        role_code,
                        debit_amount,
                        credit_amount,
                    ),
                )
            connection.commit()
'''
          helper = helper.replace(commit_anchor, balanced_lines, 1)
          path.write_text(text[:start] + helper + text[end:], encoding="utf-8")
          PY
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce coverage and repository contracts
        run: |
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Publish verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr2-ledger-invariants.yml
          python - <<'PY'
          from pathlib import Path

          for path_name in (
              "tests/test_accounting_core.py",
              "tests/test_http_api.py",
              "tests/test_postgres_posting.py",
          ):
              path = Path(path_name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce accounting command and ledger invariants"
          git push origin HEAD:agent/accounting-posting-foundation
