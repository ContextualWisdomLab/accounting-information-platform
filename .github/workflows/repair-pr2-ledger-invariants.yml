name: Verify PR 2 database-owned journal invariants

on:
  push:
    branches:
      - agent/accounting-pr2-ledger-invariants

permissions:
  contents: write

concurrency:
  group: verify-pr2-ledger-invariants
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact invariant branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/accounting-pr2-ledger-invariants
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Apply reviewed HTTP, documentation, and repository repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path(".github/workflows/repair-pr2-review-cluster.yml")
          workflow_text = workflow_path.read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^          python - <<'PY'\n(?P<body>.*?)^          PY\n",
              workflow_text,
          )
          if match is None:
              raise SystemExit("embedded review repair script is missing")
          exec(compile(textwrap.dedent(match.group("body")), str(workflow_path), "exec"), {})

          contracts_path = Path("tests/test_repository_contracts.py")
          contracts = contracts_path.read_text(encoding="utf-8")
          invalid = '''            'UPDATE "accounting_core"."general_journal" SET journal_status_code = 'posted';',
          '''
          corrected = '''            "UPDATE \\"accounting_core\\".\\"general_journal\\" SET journal_status_code = 'posted';",
          '''
          if invalid not in contracts:
              raise SystemExit("quoted append-only regression fixture did not match")
          contracts_path.write_text(contracts.replace(invalid, corrected, 1), encoding="utf-8")

          postgres_path = Path("tests/test_postgres_posting.py")
          postgres_tests = postgres_path.read_text(encoding="utf-8")
          ledger_setup = '''        self.ledger = PostgresPostingLedger(
                      DATABASE_URL, tenant_reference=self.policy.tenant_reference
                  )
          '''
          patched_ledger_setup = ledger_setup + '''        self._local_billing_origin_patch = mock.patch(
                      "accounting_information_platform.billing_pull._require_safe_configured_billing_origin"
                  )
                  self._local_billing_origin_patch.start()
                  self.addCleanup(self._local_billing_origin_patch.stop)
          '''
          if postgres_tests.count(ledger_setup) != 1:
              raise SystemExit("PostgreSQL test ledger setup drifted")
          postgres_path.write_text(
              postgres_tests.replace(ledger_setup, patched_ledger_setup, 1),
              encoding="utf-8",
          )

          http_path = Path("tests/test_http_api.py")
          http_tests = http_path.read_text(encoding="utf-8")
          class_marker = "class BillingPullRejectedProposalHttpTests(unittest.TestCase):"
          before, marker, after = http_tests.partition(class_marker)
          if not marker:
              raise SystemExit("Billing pull HTTP test class is missing")
          setup = '''        self.case.setUp()
                  self.addCleanup(self.case.doCleanups)
                  self.addCleanup(self.case.tearDown)
          '''
          patched_setup = setup + '''        self._local_billing_origin_patch = mock.patch(
                      "accounting_information_platform.billing_pull._require_safe_configured_billing_origin"
                  )
                  self._local_billing_origin_patch.start()
                  self.addCleanup(self._local_billing_origin_patch.stop)
          '''
          if setup not in after:
              raise SystemExit("Billing pull HTTP setup drifted")
          after = after.replace(setup, patched_setup, 1)
          http_path.write_text(before + marker + after, encoding="utf-8")
          PY
      - name: Add role-gated period writes and deferred balance enforcement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = '''BEGIN;

          DO $role_setup$
          BEGIN
              IF to_regrole('accounting_closing_writer') IS NULL THEN
                  CREATE ROLE accounting_closing_writer NOLOGIN;
              END IF;
          END
          $role_setup$;

          CREATE OR REPLACE FUNCTION accounting_core.guard_period_insert()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          DECLARE
              period_status_value text;
              journal_write_role_value text;
          BEGIN
              SELECT fiscal_period.period_status_code
                INTO period_status_value
                FROM accounting_core.fiscal_period
               WHERE fiscal_period.tenant_account_id = NEW.tenant_account_id
                 AND fiscal_period.fiscal_period_id = NEW.fiscal_period_id;

              IF period_status_value IS NULL THEN
                  RAISE EXCEPTION
                      'fiscal period is missing for this journal insert (period_closed)'
                      USING ERRCODE = 'check_violation';
              END IF;

              IF period_status_value = 'open' THEN
                  RETURN NEW;
              END IF;

              journal_write_role_value := nullif(
                  current_setting('accounting_core.journal_write_role', true),
                  ''
              );

              IF period_status_value = 'soft_closed'
                 AND journal_write_role_value IN ('period_closing', 'adjusting', 'reversal')
                 AND pg_has_role(session_user, 'accounting_closing_writer', 'MEMBER')
              THEN
                  RETURN NEW;
              END IF;

              RAISE EXCEPTION
                  'Fiscal period is % (period_closed). Ordinary journals cannot be inserted after close. Post the AIS closing journal before hard-close; do not insert a later ordinary or reversal journal into a locked period.',
                  period_status_value
                  USING ERRCODE = 'check_violation';
          END;
          $$;

          CREATE TRIGGER closed_period_guard
              BEFORE INSERT ON accounting_core.general_journal
              FOR EACH ROW
              EXECUTE FUNCTION accounting_core.guard_period_insert();

          CREATE OR REPLACE FUNCTION accounting_core.assert_journal_balance()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          DECLARE
              target_tenant_id uuid;
              target_journal_id uuid;
              journal_exists_value boolean;
              line_count_value bigint;
              debit_total_value numeric(38, 6);
              credit_total_value numeric(38, 6);
          BEGIN
              target_tenant_id := COALESCE(NEW.tenant_account_id, OLD.tenant_account_id);
              target_journal_id := COALESCE(NEW.general_journal_id, OLD.general_journal_id);

              SELECT EXISTS (
                  SELECT 1
                    FROM accounting_core.general_journal
                   WHERE general_journal.tenant_account_id = target_tenant_id
                     AND general_journal.general_journal_id = target_journal_id
              )
                INTO journal_exists_value;

              IF NOT journal_exists_value THEN
                  RETURN NULL;
              END IF;

              SELECT count(*),
                     COALESCE(sum(journal_entry_line.debit_amount), 0),
                     COALESCE(sum(journal_entry_line.credit_amount), 0)
                INTO line_count_value, debit_total_value, credit_total_value
                FROM accounting_core.journal_entry_line
               WHERE journal_entry_line.tenant_account_id = target_tenant_id
                 AND journal_entry_line.general_journal_id = target_journal_id;

              IF line_count_value = 0 OR debit_total_value <> credit_total_value THEN
                  RAISE EXCEPTION
                      'journal must contain lines whose debit and credit totals are equal (journal_unbalanced)'
                      USING ERRCODE = 'check_violation';
              END IF;

              RETURN NULL;
          END;
          $$;

          CREATE CONSTRAINT TRIGGER general_journal_balance_guard
              AFTER INSERT OR UPDATE ON accounting_core.general_journal
              DEFERRABLE INITIALLY DEFERRED
              FOR EACH ROW
              EXECUTE FUNCTION accounting_core.assert_journal_balance();

          CREATE CONSTRAINT TRIGGER journal_entry_balance_guard
              AFTER INSERT OR UPDATE OR DELETE ON accounting_core.journal_entry_line
              DEFERRABLE INITIALLY DEFERRED
              FOR EACH ROW
              EXECUTE FUNCTION accounting_core.assert_journal_balance();

          COMMIT;
          '''
          Path("database/migrations/0005_closed_period_guard.sql").write_text(
              migration,
              encoding="utf-8",
          )

          test_path = Path("tests/test_postgres_posting.py")
          tests = test_path.read_text(encoding="utf-8")
          if "from psycopg import sql\n" not in tests:
              tests = tests.replace("import psycopg\n", "import psycopg\nfrom psycopg import sql\n", 1)
          marker = "    def _seed_master_data(self, *, period_status_code: str) -> str:\n"
          regression_tests = '''    def test_database_rejects_unbalanced_journal_at_commit(self) -> None:
              """A direct SQL line cannot leave a durable journal out of balance."""
              receipt = self.ledger.post(self._two_line_proposal(), self.policy)
              connection = psycopg.connect(DATABASE_URL)
              try:
                  connection.execute(
                      "SELECT set_config('app.tenant_account_id', %s, false)",
                      (str(self.tenant_id),),
                  )
                  journal_id, chart_account_id = connection.execute(
                      """
                      SELECT general_journal.general_journal_id,
                             journal_entry_line.chart_account_id
                        FROM accounting_core.general_journal
                        JOIN accounting_core.journal_entry_line
                          ON journal_entry_line.tenant_account_id = general_journal.tenant_account_id
                         AND journal_entry_line.general_journal_id = general_journal.general_journal_id
                       WHERE general_journal.tenant_account_id = %s
                         AND general_journal.journal_reference = %s
                         AND journal_entry_line.line_number = 1
                      """,
                      (self.tenant_id, receipt.journal_reference),
                  ).fetchone()
                  connection.execute(
                      """
                      INSERT INTO accounting_core.journal_entry_line (
                          tenant_account_id, general_journal_id, line_number, chart_account_id,
                          account_role_code, debit_amount, credit_amount, line_description
                      )
                      VALUES (%s, %s, 3, %s, 'accounts_receivable', 1, 0, 'invalid direct SQL')
                      """,
                      (self.tenant_id, journal_id, chart_account_id),
                  )
                  with self.assertRaisesRegex(
                      psycopg.errors.CheckViolation,
                      "debit and credit totals are equal",
                  ):
                      connection.commit()
                  connection.rollback()
                  connection.execute(
                      "SELECT set_config('app.tenant_account_id', %s, false)",
                      (str(self.tenant_id),),
                  )
                  line_count = connection.execute(
                      """
                      SELECT count(*)
                        FROM accounting_core.journal_entry_line
                       WHERE tenant_account_id = %s
                         AND general_journal_id = %s
                      """,
                      (self.tenant_id, journal_id),
                  ).fetchone()[0]
                  self.assertEqual(line_count, 2)
              finally:
                  connection.close()

          def test_soft_close_guc_requires_database_role_membership(self) -> None:
              """An unprivileged session cannot self-assert the soft-close write role."""
              receipt = self.ledger.post(self._two_line_proposal(), self.policy)
              self._set_period_status("soft_closed")
              role_name = f"accounting_unprivileged_{uuid.uuid4().hex[:12]}"
              with psycopg.connect(DATABASE_URL, autocommit=True) as administrator:
                  administrator.execute(
                      sql.SQL("CREATE ROLE {} NOLOGIN").format(sql.Identifier(role_name))
                  )
                  administrator.execute(
                      sql.SQL("GRANT USAGE ON SCHEMA accounting_core, accounting_integration TO {}")
                      .format(sql.Identifier(role_name))
                  )
                  administrator.execute(
                      sql.SQL("GRANT SELECT ON accounting_core.fiscal_period TO {}")
                      .format(sql.Identifier(role_name))
                  )
                  administrator.execute(
                      sql.SQL("GRANT INSERT ON accounting_core.general_journal TO {}")
                      .format(sql.Identifier(role_name))
                  )
                  source_row = administrator.execute(
                      """
                      SELECT legal_entity_id, accounting_book_id, fiscal_period_id,
                             transaction_currency_code, functional_currency_code,
                             transaction_date, accounting_date, source_proposal_record_id,
                             accounting_policy_version, posting_rule_version
                        FROM accounting_core.general_journal
                       WHERE tenant_account_id = %s
                         AND journal_reference = %s
                      """,
                      (self.tenant_id, receipt.journal_reference),
                  ).fetchone()

              connection = psycopg.connect(DATABASE_URL)
              try:
                  connection.execute(
                      sql.SQL("SET SESSION AUTHORIZATION {}").format(sql.Identifier(role_name))
                  )
                  connection.execute(
                      "SELECT set_config('app.tenant_account_id', %s, false)",
                      (str(self.tenant_id),),
                  )
                  connection.execute(
                      "SELECT set_config('accounting_core.journal_write_role', 'reversal', false)"
                  )
                  self.assertFalse(
                      connection.execute(
                          "SELECT pg_has_role(session_user, 'accounting_closing_writer', 'MEMBER')"
                      ).fetchone()[0]
                  )
                  with self.assertRaisesRegex(
                      psycopg.errors.CheckViolation,
                      "period_closed",
                  ):
                      connection.execute(
                          """
                          INSERT INTO accounting_core.general_journal (
                              tenant_account_id, legal_entity_id, accounting_book_id,
                              fiscal_period_id, journal_reference, journal_status_code,
                              transaction_currency_code, functional_currency_code,
                              transaction_date, accounting_date, source_proposal_record_id,
                              accounting_policy_version, posting_rule_version
                          )
                          VALUES (
                              %s, %s, %s, %s, %s, 'posted', %s, %s, %s, %s, %s, %s, %s
                          )
                          """,
                          (
                              self.tenant_id,
                              source_row[0],
                              source_row[1],
                              source_row[2],
                              f"{receipt.journal_reference}:unauthorized",
                              source_row[3],
                              source_row[4],
                              source_row[5],
                              source_row[6],
                              source_row[7],
                              source_row[8],
                              source_row[9],
                          ),
                      )
                  connection.rollback()
              finally:
                  connection.close()
                  with psycopg.connect(DATABASE_URL, autocommit=True) as administrator:
                      administrator.execute(
                          sql.SQL("DROP OWNED BY {}").format(sql.Identifier(role_name))
                      )
                      administrator.execute(
                          sql.SQL("DROP ROLE {}").format(sql.Identifier(role_name))
                      )

              self.assertEqual(self._count_table("accounting_core.general_journal"), 1)

          '''
          if "test_database_rejects_unbalanced_journal_at_commit" not in tests:
              if marker not in tests:
                  raise SystemExit("PostgreSQL helper insertion marker drifted")
              tests = tests.replace(marker, regression_tests + marker, 1)
          test_path.write_text(tests, encoding="utf-8")

          adr_path = Path("docs/adr/0003-append-only-journals.md")
          adr = adr_path.read_text(encoding="utf-8")
          old_gate = """Checked-in PostgreSQL migrations cannot `UPDATE` or `DELETE` `general_journal` or `journal_entry_line`. `scripts/validate_repository.py` rejects those statements so later schema work cannot rewrite posted journals and still pass CI. `UPDATE` or `DELETE` of other tables remains valid. This gate does not add deferred balance triggers or `FORCE ROW LEVEL SECURITY` to the foundation migration.

`0005_closed_period_guard.sql` adds `guard_period_insert` / `closed_period_guard` so an `INSERT` into `general_journal` for a `soft_closed` or `hard_closed` period fails at the database. Ordinary privileged SQL cannot land a later journal after close. AIS sets a transaction-local `accounting_core.journal_write_role` (`period_closing`, `adjusting`, or `reversal`) before the closer, adjusting, or reversal insert; that role is not a Billing `journal_type`. Hard-closed periods reject every insert, including reversal-shaped rows. The AIS closer still posts the period-closing journal first, then flips `period_status_code`.
"""
          new_gate = """Checked-in PostgreSQL migrations cannot `UPDATE`, `DELETE`, `TRUNCATE`, or `DROP TABLE` `general_journal` or `journal_entry_line`, including schema-qualified and quoted identifiers. `scripts/validate_repository.py` rejects those statements so later schema work cannot rewrite posted journals and still pass CI. Destructive statements against unrelated tables remain valid.

`0005_closed_period_guard.sql` owns two database invariants. First, `guard_period_insert` / `closed_period_guard` rejects an `INSERT` into `general_journal` for a `soft_closed` or `hard_closed` period. A soft-close exception requires both a transaction classification in `accounting_core.journal_write_role` and membership of the session login in the NOLOGIN `accounting_closing_writer` database role; a caller cannot authorize itself by setting the GUC alone. Hard-closed periods reject every insert, including reversal-shaped rows. The AIS closer still posts the period-closing journal first, then flips `period_status_code`.

Second, deferred constraint triggers on `general_journal` and `journal_entry_line` call `assert_journal_balance` at transaction commit. A durable journal must contain at least one line and its complete debit and credit totals must be equal. Direct SQL that inserts, updates, or deletes a line cannot commit an unbalanced monetary population. Application validation remains an earlier diagnostic, but PostgreSQL is the final storage boundary.
"""
          if old_gate not in adr:
              raise SystemExit("ADR 0003 invariant paragraph drifted")
          adr_path.write_text(adr.replace(old_gate, new_gate, 1), encoding="utf-8")

          operability_path = Path("docs/OPERABILITY.md")
          operability = operability_path.read_text(encoding="utf-8").rstrip()
          role_section = '''

          ## Database-owned journal write invariants

          Migration `0005_closed_period_guard.sql` creates the NOLOGIN group role `accounting_closing_writer`. Grant that role only to purpose-limited AIS database login roles that execute period close, adjusting journals, or reversals; do not grant it to Billing, reporting, or ordinary journal-ingestion roles. A runtime transaction must still set `accounting_core.journal_write_role` to `period_closing`, `adjusting`, or `reversal`. The GUC classifies the operation but never grants authority by itself.

          PostgreSQL deferred constraint triggers verify the complete journal population when a transaction commits. Every durable `general_journal` must contain lines with exactly equal debit and credit totals. A direct-SQL mutation that leaves a journal empty or unbalanced fails with `journal_unbalanced`; repair the transaction before retrying rather than disabling the trigger.
          '''
          if "## Database-owned journal write invariants" not in operability:
              operability += role_section
          operability_path.write_text(operability.rstrip() + "\n", encoding="utf-8")

          references_path = Path("docs/doctoring/REFERENCES.md")
          references = references_path.read_text(encoding="utf-8")
          references = references.replace(
              "PostgreSQL Global Development Group. (2026). *PostgreSQL 18.4 release notes*.",
              "PostgreSQL Global Development Group. (2026c). *PostgreSQL 18.4 release notes*.",
              1,
          )
          postgres_refs = """PostgreSQL Global Development Group. (2026a). *CREATE TRIGGER*. https://www.postgresql.org/docs/18/sql-createtrigger.html

PostgreSQL Global Development Group. (2026b). *Database roles*. https://www.postgresql.org/docs/18/user-manag.html

"""
          if "*CREATE TRIGGER*" not in references:
              anchor = "PostgreSQL Global Development Group. (2026c). *PostgreSQL 18.4 release notes*."
              if anchor not in references:
                  raise SystemExit("PostgreSQL reference anchor drifted")
              references = references.replace(anchor, postgres_refs + anchor, 1)
          references_path.write_text(references, encoding="utf-8")
          PY
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce coverage and repository contracts
        run: |
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Remove temporary workflows and publish invariant repair
        run: |
          rm .github/workflows/repair-pr2-review-cluster.yml
          rm .github/workflows/repair-pr2-followup.yml
          rm .github/workflows/repair-pr2-ledger-invariants.yml
          python - <<'PY'
          from pathlib import Path

          for path_name in ("tests/test_http_api.py", "tests/test_postgres_posting.py"):
              path = Path(path_name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce database-owned journal invariants"
          git push origin HEAD:agent/accounting-pr2-ledger-invariants
