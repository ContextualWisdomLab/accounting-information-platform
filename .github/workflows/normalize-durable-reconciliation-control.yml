name: Normalize durable reconciliation control

on:
  push:
    branches:
      - agent/durable-reconciliation-control

permissions:
  contents: write

concurrency:
  group: normalize-durable-reconciliation-control
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes --disable-pip-version-check --only-binary=:all: -r requirements-quality.txt
      - name: Apply narrow loader and README repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          persistence = Path("src/accounting_information_platform/persistence.py")
          text = persistence.read_text(encoding="utf-8")
          old = '''    assignment_identity_migration_path = (\n        migration_path.parent / "0012_bank_assignment_command_identity.sql"\n    )\n    if not assignment_identity_migration_path.is_file():\n        raise AccountingValidationError(\n            "Bank-account assignment command-identity migration is missing at "\n            f"{assignment_identity_migration_path}. Restore "\n            "database/migrations/0012_bank_assignment_command_identity.sql, then retry."\n        )\n    psycopg = _import_psycopg()\n'''
          new = '''    assignment_identity_migration_path = (\n        migration_path.parent / "0012_bank_assignment_command_identity.sql"\n    )\n    if not assignment_identity_migration_path.is_file():\n        raise AccountingValidationError(\n            "Bank-account assignment command-identity migration is missing at "\n            f"{assignment_identity_migration_path}. Restore "\n            "database/migrations/0012_bank_assignment_command_identity.sql, then retry."\n        )\n    reconciliation_control_migration_path = (\n        migration_path.parent / "0013_reconciliation_run_exception_evidence.sql"\n    )\n    if not reconciliation_control_migration_path.is_file():\n        raise AccountingValidationError(\n            "Reconciliation run/exception evidence migration is missing at "\n            f"{reconciliation_control_migration_path}. Restore "\n            "database/migrations/0013_reconciliation_run_exception_evidence.sql, then retry."\n        )\n    psycopg = _import_psycopg()\n'''
          if old not in text:
              raise SystemExit("expected migration-loader validation boundary not found")
          text = text.replace(old, new, 1)
          old_execute = '''            connection.execute(\n                assignment_identity_migration_path.read_text(encoding="utf-8")\n            )\n'''
          new_execute = old_execute + '''            connection.execute(\n                reconciliation_control_migration_path.read_text(encoding="utf-8")\n            )\n'''
          if old_execute not in text:
              raise SystemExit("expected migration-loader execution boundary not found")
          persistence.write_text(text.replace(old_execute, new_execute, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_readme = "migration chain through `database/migrations/0012_bank_assignment_command_identity.sql`"
          new_readme = "migration chain through `database/migrations/0013_reconciliation_run_exception_evidence.sql`"
          if old_readme not in text:
              raise SystemExit("expected README migration boundary not found")
          readme.write_text(text.replace(old_readme, new_readme, 1), encoding="utf-8")

          contract = Path("tests/test_foundation_install_manifest_contract.py")
          text = contract.read_text(encoding="utf-8")
          marker = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          addition = '''\n    def test_install_fails_closed_when_reconciliation_control_migration_is_missing(self) -> None:\n        """The foundation loader may not silently omit migration 0013."""\n        original_is_file = Path.is_file\n\n        def is_file(path: Path) -> bool:\n            if path.name == "0013_reconciliation_run_exception_evidence.sql":\n                return False\n            return original_is_file(path)\n\n        with patch.object(Path, "is_file", is_file):\n            with self.assertRaises(AccountingValidationError):\n                apply_foundation_migration(\n                    "postgresql://unused",\n                    ROOT / "database/migrations/0001_accounting_foundation.sql",\n                )\n'''
          if marker not in text:
              raise SystemExit("expected foundation manifest test boundary not found")
          contract.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
      - name: Verify focused RED boundaries are GREEN
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest -v \
            tests.test_readme_migration_contract \
            tests.test_foundation_install_manifest_contract \
            tests.test_reconciliation_run_exception_persistence_red
      - name: Remove temporary normalization workflow
        run: rm .github/workflows/normalize-durable-reconciliation-control.yml
      - name: Publish normalized canonical branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/accounting_information_platform/persistence.py tests/test_foundation_install_manifest_contract.py .github/workflows/normalize-durable-reconciliation-control.yml
          git diff --cached --check
          git commit -m 'fix: install durable reconciliation control migration'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/durable-reconciliation-control
