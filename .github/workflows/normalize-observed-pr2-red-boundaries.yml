name: Normalize observed PR 2 RED boundaries

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: normalize-observed-pr2-red-boundaries-pr
  cancel-in-progress: false

jobs:
  normalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      EXPECTED_RED_SHA: 41de86d444ee02d3851ff13f28e4ef70135d89b2
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head and unchanged observed RED source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EXPECTED_RED_SHA}^{commit}"
          git diff --exit-code "$EXPECTED_RED_SHA" "$EXPECTED_HEAD_SHA" -- . \
            ':(exclude).github/workflows/normalize-observed-pr2-red-boundaries.yml'
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Prove each observed boundary is RED before repair
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          red_tests=(
            "tests.test_adjusting_journal_boundary.AdjustingJournalBoundaryTests.test_zero_amount_line_fails_closed_at_application_boundary"
            "tests.test_financial_statement_package_snapshot.FinancialStatementPackageSnapshotTests.test_package_cannot_mix_pre_and_post_commit_statement_components"
            "tests.test_home_tax_http_status_boundary.HomeTaxHttpStatusBoundaryTests.test_missing_source_provenance_is_422_not_not_found"
            "tests.test_outbox_tenant_invariant.OutboxTenantInvariantTests.test_superuser_cannot_insert_outbox_event_without_tenant"
          )
          for test_name in "${red_tests[@]}"; do
            if python -m unittest "$test_name" -v; then
              echo "expected observed RED test to fail before repair: $test_name" >&2
              exit 1
            fi
          done
      - name: Apply narrow causal repairs
        run: python scripts/normalize_observed_pr2_red_boundaries.py
      - name: Run focused GREEN regressions
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_adjusting_journal_boundary.AdjustingJournalBoundaryTests.test_zero_amount_line_fails_closed_at_application_boundary
          tests.test_financial_statement_package_snapshot.FinancialStatementPackageSnapshotTests.test_package_cannot_mix_pre_and_post_commit_statement_components
          tests.test_home_tax_http_status_boundary.HomeTaxHttpStatusBoundaryTests.test_missing_source_provenance_is_422_not_not_found
          tests.test_outbox_tenant_invariant.OutboxTenantInvariantTests.test_superuser_cannot_insert_outbox_event_without_tenant
      - name: Run full PostgreSQL and repository tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Enforce complete owned statement and branch coverage
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report --fail-under=100 --show-missing
      - name: Validate repository and compile
        run: |
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Publish normalized canonical branch only if writer lease is unchanged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/agent/accounting-posting-foundation | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          rm .github/workflows/normalize-observed-pr2-red-boundaries.yml
          rm scripts/normalize_observed_pr2_red_boundaries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close accounting foundation RED boundaries"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/accounting-posting-foundation
