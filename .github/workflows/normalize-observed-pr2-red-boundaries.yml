name: Normalize observed PR2 RED boundaries

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: normalize-observed-pr2-red-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RED_PARENT_SHA: 149ef5e58b0b44d04e05cc529d4bbf40bcd42a82
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact trigger and RED parent boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git fetch --no-tags origin "$RED_PARENT_SHA" --depth=1
          git diff --exit-code "$RED_PARENT_SHA" "$TRIGGER_SHA" -- . \
            ':(exclude).github/workflows/normalize-observed-pr2-red-boundaries.yml' \
            ':(exclude)scripts/normalize_observed_pr2_red_boundaries.py'
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Reconfirm observed RED boundaries before repair
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python -m unittest -v \
            tests.test_period_open_command_idempotency \
            tests.test_reversal_cache_recovery
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply narrow causal repair
        run: python scripts/normalize_observed_pr2_red_boundaries.py
      - name: Remove observed RED normalization machinery before final validation
        run: |
          rm .github/workflows/normalize-observed-pr2-red-boundaries.yml
          rm scripts/normalize_observed_pr2_red_boundaries.py
      - name: Run focused repaired boundaries
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_period_open_command_idempotency
          tests.test_reversal_cache_recovery
      - name: Run full behavior and PostgreSQL integration suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Measure complete owned production coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce complete owned statement and branch coverage
        run: python -m coverage report --fail-under=100 --show-missing
      - name: Validate repository contracts and public docstrings
        run: python scripts/validate_repository.py .
      - name: Compile production and tests
        run: python -m compileall -q src scripts tests
      - name: Verify branch remained on the observed exact head
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "$remote_sha" = "$TRIGGER_SHA"
      - name: Normalize repaired tree onto canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/normalize-observed-pr2-red-boundaries.yml
          test ! -e scripts/normalize_observed_pr2_red_boundaries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: harden period-open replay and reversal recovery"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
