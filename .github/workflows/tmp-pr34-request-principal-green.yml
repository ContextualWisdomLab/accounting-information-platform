name: Temporary PR34 Request Principal GREEN

on:
  push:
    branches:
      - feat/purpose-bound-authorization
    paths:
      - .github/workflows/tmp-pr34-request-principal-green.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/purpose-bound-authorization
          fetch-depth: 1
          persist-credentials: false

      - name: Repair request-scoped identity and primary research links
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          http = "src/accounting_information_platform/http_api.py"
          replace_exact(
              http,
              "        authorization_context: AuthenticatedPrincipal | None = None,\n",
              "        request_principal_resolver: Callable[[\\\"JournalProposalHandler\\\"], AuthenticatedPrincipal | None] | None = None,\n",
          )
          replace_exact(
              http,
              "        self.authorization_context = authorization_context\n",
              "        self.request_principal_resolver = request_principal_resolver\n",
          )
          replace_exact(
              http,
              "        decision = authorize(\n            self.server.authorization_context,\n            tenant_header,\n            operation_code,\n        )\n",
              "        resolver = self.server.request_principal_resolver\n        try:\n            principal = None if resolver is None else resolver(self)\n        except Exception:\n            self._write_error(\n                503,\n                \\\"caller identity validation is unavailable. Ask the platform operator to restore the trusted identity adapter, then retry.\\\",\n            )\n            return False\n        decision = authorize(\n            principal,\n            tenant_header,\n            operation_code,\n        )\n",
          )
          replace_exact(
              http,
              "    authorization_context: AuthenticatedPrincipal | None = None,\n) -> JournalProposalServer:\n",
              "    request_principal_resolver: Callable[[JournalProposalHandler], AuthenticatedPrincipal | None] | None = None,\n) -> JournalProposalServer:\n",
              count=2,
          )
          replace_exact(
              http,
              "        (host, port), database_url, tenant_reference, authorization_context\n",
              "        (host, port), database_url, tenant_reference, request_principal_resolver\n",
          )
          replace_exact(
              http,
              "        authorization_context,\n    )\n",
              "        request_principal_resolver,\n    )\n",
          )
          replace_exact(
              http,
              '    """Create a stdlib HTTP server that posts Billing proposals, AIS adjusting journals, pulls, closes, opens periods, accepts bank-statement evidence, and reads TB, statements, journals, reversals, receivable aging, payable aging, outbox, and audit history."""\n',
              '    """Create an HTTP server whose trusted adapter resolves one principal per request."""\n',
          )
          replace_exact(
              http,
              '    """Bind 127.0.0.1:$PORT by default and serve AIS HTTP commands."""\n',
              '    """Bind 127.0.0.1:$PORT and resolve caller identity independently per request."""\n',
          )

          auth_test = "tests/test_authorization.py"
          replace_exact(
              auth_test,
              '            authorization_context=principal("accounting.read_catalog"),\n',
              '            request_principal_resolver=lambda _request: principal("accounting.read_catalog"),\n',
          )

          pg_test = "tests/test_postgres_posting.py"
          replace_exact(
              pg_test,
              "            authorization_context,\n        )\n",
              "            request_principal_resolver=lambda _request: authorization_context,\n        )\n",
          )

          replacements = {
              "docs/OPERABILITY.md": [
                  (
                      "Pass that context explicitly to the server; the standalone runner supplies no principal and therefore\ndenies every accounting route except `/healthz`.",
                      "Provide `request_principal_resolver` as the trusted host adapter: it validates each incoming request and returns that request's `AuthenticatedPrincipal`. A static server-wide principal is not supported. The standalone runner supplies no resolver and therefore denies every accounting route except `/healthz`.",
                  ),
              ],
              "docs/SECURITY.md": [
                  (
                      "The trusted host identity adapter must validate issuer, audience, expiry, signature, and token binding\nbefore passing an `AuthenticatedPrincipal` to AIS.",
                      "The trusted host identity adapter must validate issuer, audience, expiry, signature, and token binding for every request before returning that request's `AuthenticatedPrincipal` to AIS. The production HTTP factory accepts a request-scoped resolver rather than a reusable server-wide principal.",
                  ),
              ],
              "docs/ARCHITECTURE.md": [
                  (
                      "Production exposure therefore requires a trusted host or gateway that authenticates the caller before traffic reaches this process and supplies a validated `AuthenticatedPrincipal` with an explicit `human`, `service`, or `agent` kind.",
                      "Production exposure therefore requires a trusted host or gateway whose request-scoped resolver authenticates each caller before accounting authorization and returns a validated `AuthenticatedPrincipal` with an explicit `human`, `service`, or `agent` kind; the server does not cache one caller identity for later requests.",
                  ),
              ],
              "docs/adr/0055-purpose-bound-authorization.md": [
                  (
                      "The standalone runner has no authenticated principal by default and therefore exposes only health\nstatus until a trusted host adapter supplies a validated context to\n`create_journal_proposal_server` or `run_journal_proposal_server`.",
                      "The standalone runner has no request-principal resolver by default and therefore exposes only health status. A trusted host adapter integrates through `request_principal_resolver`; the resolver is invoked for each request and must return only that request's validated `AuthenticatedPrincipal`. The server never accepts one reusable authenticated principal as authority for every connected client.",
                  ),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace_exact(path, old, new)

          doi = "https://doi.org/10.1016/j.jisa.2025.103997"
          for path in (
              "docs/adr/0055-purpose-bound-authorization.md",
              "docs/doctoring/2026-09-01-reconciliation-completion-authorization-policy.md",
              "docs/doctoring/REFERENCES.md",
          ):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if "https://consensus.app/papers/data-flow-security-in-rolebased-access-control-logrippo/95874bd5d780530a8e80eece583cda0e/" not in text:
                  raise SystemExit(f"{path}: expected Consensus secondary-source URL")
              start = "https://consensus.app/papers/data-flow-security-in-rolebased-access-control-logrippo/95874bd5d780530a8e80eece583cda0e/"
              text = text.replace(start + "?utm_source=chatgpt", doi).replace(start, doi)
              target.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n"
          if marker not in text:
              raise SystemExit("CHANGELOG Unreleased marker missing")
          note = (
              "- The accounting HTTP boundary now resolves a validated principal independently for every request through a trusted `request_principal_resolver`; the public server factory no longer accepts one reusable principal whose permissions every reachable client could inherit. Identity-adapter failures fail closed before an allowed audit decision is written.\n"
          )
          if note not in text:
              text = text.replace(marker, marker + note, 1)
          changelog.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/tmp-pr34-request-principal-green.yml
          git diff --check

      - name: Verify focused request authorization GREEN
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest -v \
            tests.test_authorization \
            tests.test_request_scoped_authorization_context \
            tests.test_reconciliation_completion_authorization_contract
          PYTHONPATH=. python3 scripts/validate_repository.py .
          python3 -m compileall -q src tests/test_request_scoped_authorization_context.py
          test ! -e .github/workflows/tmp-pr34-request-principal-green.yml
          git diff --check

      - name: Publish exact repaired source
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::A non-GITHUB_TOKEN writer credential is required so synchronize-triggered checks run on the repaired head.'
            exit 1
          fi
          branch='feat/purpose-bound-authorization'
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(auth): resolve validated principal per request'
          gh auth setup-git
          git push origin HEAD:"$branch"
