name: Accounting Foundation CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: accounting-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  accounting-foundation:
    name: Accounting foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pin reproducible build timestamp
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$EXPECTED_SHA")"
          test -n "$source_date_epoch"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality and packaging dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior and repository tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce complete statement and branch coverage
        run: python -m coverage report --fail-under=100 --show-missing
      - name: Validate repository contracts
        run: python scripts/validate_repository.py .
      - name: Compile production and test modules
        run: python -m compileall -q src scripts tests
      - name: Install source package without network resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Smoke-test installed public API
        run: python -c "import accounting_information_platform as aip; assert aip.PostingLedger.__name__ == 'PostingLedger'"
      - name: Build reproducible wheel and evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist dist-rebuild build src/*.egg-info
          mkdir -p dist dist-rebuild
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          rm -rf build src/*.egg-info
          python -m pip wheel --no-deps --no-build-isolation -w dist-rebuild .
          primary_wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          rebuilt_wheel="$(find dist-rebuild -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$primary_wheel"
          test -n "$rebuilt_wheel"
          test "$(sha256sum "$primary_wheel" | cut -d' ' -f1)" = "$(sha256sum "$rebuilt_wheel" | cut -d' ' -f1)"
          python scripts/generate_supply_chain_evidence.py \
            --wheel "$primary_wheel" \
            --project pyproject.toml \
            --output-directory dist \
            --source-sha "$EXPECTED_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          (cd dist && sha256sum -c SHA256SUMS)
          python -m pip install --no-index --no-deps --force-reinstall "$primary_wheel"
          cd "${RUNNER_TEMP}"
          python -c "import accounting_information_platform as aip; assert aip.PostingLedger.__name__ == 'PostingLedger'"
      - name: Verify typing marker is packaged
        run: python -c "import zipfile, glob; wheel=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(wheel).namelist(); assert 'accounting_information_platform/py.typed' in names"
      - name: Attest wheel provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ github.workspace }}/dist/*.whl
      - name: Attest wheel SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ github.workspace }}/dist/*.whl
          sbom-path: ${{ github.workspace }}/dist/sbom.spdx.json
      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accounting-information-platform-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
