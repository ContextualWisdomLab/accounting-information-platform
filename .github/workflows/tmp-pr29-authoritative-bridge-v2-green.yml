name: Temporary PR29 authoritative bridge v2 GREEN

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-authoritative-bridge-v2-green.yml

permissions:
  contents: write

concurrency:
  group: pr29-authoritative-bridge-v2-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          fetch-depth: 2
      - name: Verify single-writer parent
        shell: bash
        env:
          EXPECTED_PARENT: f544479be10b72872bb8fd93cbc19ee52300dc8d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch --no-tags origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Prove repeatable-read and book-scope REDs
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          for test_name in \
            tests.test_reconciliation_close_package_database_consistency_red.ReconciliationClosePackageDatabaseConsistencyTests.test_authority_builder_uses_repeatable_read_snapshot_session \
            tests.test_reconciliation_close_package_database_consistency_red.ReconciliationClosePackageDatabaseConsistencyTests.test_database_cash_population_is_scoped_to_assignment_accounting_book \
            tests.test_reconciliation_close_package_database_population_red
          do
            set +e
            python -m unittest -v "$test_name" > /tmp/pr29-red.log 2>&1
            status=$?
            set -e
            cat /tmp/pr29-red.log
            test "$status" -ne 0
          done
      - name: Apply narrow authoritative bridge repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          predecessor = Path(".github/workflows/tmp-pr29-authoritative-bridge-green.yml")
          workflow_text = predecessor.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          if workflow_text.count(marker) != 1:
              raise SystemExit("predecessor repair script marker changed")
          repair_body = workflow_text.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(repair_body), str(predecessor), "exec"), {})

          source = Path("src/accounting_information_platform/reconciliation_close_package.py")
          text = source.read_text(encoding="utf-8")

          session_anchor = '''    ledger = PostgresPostingLedger(database_url, tenant_reference)\n    with ledger._session() as connection:\n'''
          session_replacement = '''    ledger = PostgresPostingLedger(database_url, tenant_reference)\n    with ledger._consistent_read_session() as connection:\n'''
          if text.count(session_anchor) != 1:
              raise SystemExit("authority builder session anchor changed")
          text = text.replace(session_anchor, session_replacement, 1)

          journal_anchor = '''        FROM accounting_core.journal_entry_line AS line\n        JOIN accounting_core.general_journal AS journal\n          ON journal.tenant_account_id = line.tenant_account_id\n         AND journal.general_journal_id = line.general_journal_id\n        WHERE line.tenant_account_id = %s\n          AND line.chart_account_id::text = %s\n          AND journal.accounting_date <= %s\n'''
          journal_replacement = '''        FROM accounting_core.journal_entry_line AS line\n        JOIN accounting_core.general_journal AS journal\n          ON journal.tenant_account_id = line.tenant_account_id\n         AND journal.general_journal_id = line.general_journal_id\n        JOIN accounting_core.chart_account AS cash_account\n          ON cash_account.tenant_account_id = line.tenant_account_id\n         AND cash_account.chart_account_id = line.chart_account_id\n        WHERE line.tenant_account_id = %s\n          AND line.chart_account_id::text = %s\n          AND journal.accounting_book_id = cash_account.accounting_book_id\n          AND journal.accounting_date <= %s\n'''
          if text.count(journal_anchor) != 1:
              raise SystemExit("cash journal population scope anchor changed")
          text = text.replace(journal_anchor, journal_replacement, 1)
          source.write_text(text, encoding="utf-8")

          adr = Path("docs/adr/0056-reconciliation-close-package-provenance.md")
          adr_text = adr.read_text(encoding="utf-8")
          authority_anchor = (
              "For statement/book populations and the monetary bridge, the builder reconstructs the immutable "
          )
          if authority_anchor not in adr_text:
              raise SystemExit("ADR authoritative population paragraph changed")
          consistency_text = (
              "The authority-bearing builder performs run, approval, exception, statement and ledger reads in one "
              "PostgreSQL `REPEATABLE READ` transaction so a close package cannot combine populations observed at "
              "different database snapshots. The cash-ledger population is additionally constrained to journals "
              "whose accounting book owns the bank assignment's cash chart account; tenant-only/chart-account-only "
              "selection is not sufficient accounting scope.\n\n"
          )
          adr_text = adr_text.replace(authority_anchor, consistency_text + authority_anchor, 1)
          adr.write_text(adr_text, encoding="utf-8")
          PY
      - name: Prove focused GREEN
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_reconciliation_close_package_database_consistency_red \
            tests.test_reconciliation_close_package_database_population_red \
            tests.test_reconciliation_close_package_database_run_red \
            tests.test_reconciliation_close_package_database_authority_red
      - name: Normalize canonical branch
        shell: bash
        env:
          EXPECTED_HELPER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$EXPECTED_HELPER_SHA"
          rm .github/workflows/tmp-pr29-authoritative-bridge-green.yml
          rm .github/workflows/tmp-pr29-authoritative-bridge-v2-green.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: build reconciliation close evidence from one scoped snapshot"
          git fetch --no-tags origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$EXPECTED_HELPER_SHA"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
