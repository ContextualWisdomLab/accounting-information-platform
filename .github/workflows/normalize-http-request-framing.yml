name: Normalize HTTP request framing

on:
  push:
    branches:
      - agent/accounting-posting-foundation

permissions:
  contents: write

concurrency:
  group: normalize-http-request-framing
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize verified HTTP framing RED
    if: github.repository == 'ContextualWisdomLab/accounting-information-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact trigger and observed RED parent
        env:
          EXPECTED_PARENT: 4067565bbe78e6ca9036caf6bbc62d7a9350b1a4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Apply narrow request-framing repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/accounting_information_platform/http_api.py")
          source = path.read_text(encoding="utf-8")
          old = '''    def _read_body(self) -> bytes | None:
              length_values = self.headers.get_all("Content-Length")
              if length_values is None or len(length_values) != 1:
                  self._write_error(
                      400,
                      "exactly one Content-Length header is required. "
                      "Send one ASCII decimal Content-Length, then retry.",
                  )
                  return None
              length_text = length_values[0]
              if re.fullmatch(r"[0-9]+", length_text) is None:
                  self._write_error(
                      400,
                      "Content-Length must contain ASCII decimal digits only. "
                      "Send one ASCII decimal Content-Length, then retry.",
                  )
                  return None
              length = int(length_text)
              if length > _MAX_REQUEST_BODY_BYTES:
                  self._write_error(
                      413,
                      "request body exceeds 1 MiB. "
                      "Send a smaller JSON command, then retry.",
                  )
                  return None
              if length < 1:
                  return b""
              return self.rfile.read(length)
          '''
          new = '''    def _read_body(self) -> bytes | None:
              transfer_encoding_values = self.headers.get_all("Transfer-Encoding")
              if transfer_encoding_values:
                  self.close_connection = True
                  self._write_error(
                      400,
                      "Transfer-Encoding is not supported. "
                      "Send one ASCII decimal Content-Length and an unencoded body, then retry.",
                  )
                  return None
              length_values = self.headers.get_all("Content-Length")
              if length_values is None or len(length_values) != 1:
                  self._write_error(
                      400,
                      "exactly one Content-Length header is required. "
                      "Send one ASCII decimal Content-Length, then retry.",
                  )
                  return None
              length_text = length_values[0]
              if re.fullmatch(r"[0-9]+", length_text) is None:
                  self._write_error(
                      400,
                      "Content-Length must contain ASCII decimal digits only. "
                      "Send one ASCII decimal Content-Length, then retry.",
                  )
                  return None
              length = int(length_text)
              if length > _MAX_REQUEST_BODY_BYTES:
                  self._write_error(
                      413,
                      "request body exceeds 1 MiB. "
                      "Send a smaller JSON command, then retry.",
                  )
                  return None
              if length < 1:
                  return b""
              body = self.rfile.read(length)
              if len(body) != length:
                  self.close_connection = True
                  self._write_error(
                      400,
                      "request body is incomplete for Content-Length. "
                      "Send the declared number of body bytes, then retry.",
                  )
                  return None
              return body
          '''
          if source.count(old) != 1:
              raise SystemExit("expected exact _read_body RED boundary once")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
      - name: Verify focused framing GREEN
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_http_request_boundary_contract.HttpBodyFramingContractTests
      - name: Remove temporary normalization machinery
        run: rm .github/workflows/normalize-http-request-framing.yml
      - name: Commit normalized product source only
        env:
          BRANCH_NAME: agent/accounting-posting-foundation
        shell: bash
        run: |
          set -euo pipefail
          git add src/accounting_information_platform/http_api.py .github/workflows/normalize-http-request-framing.yml
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed-files
          printf '%s\n' '.github/workflows/normalize-http-request-framing.yml' 'src/accounting_information_platform/http_api.py' | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/changed-files
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fail closed on ambiguous HTTP framing'
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$BRANCH_NAME"
