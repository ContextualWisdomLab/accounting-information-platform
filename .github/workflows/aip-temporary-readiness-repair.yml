name: Temporary readiness trigger contract repair

on:
  push:
    branches:
      - feat/operability-readiness-baseline
    paths:
      - .github/workflows/aip-temporary-readiness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operability-readiness-baseline
          fetch-depth: 1
      - name: Apply narrow readiness trigger contract repair
        shell: bash
        env:
          REPAIR_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_SCRIPT_B64" | base64 --decode > /tmp/aip_readiness_repair.py
          python /tmp/aip_readiness_repair.py
          python -m compileall -q src/accounting_information_platform/persistence.py
      - name: Normalize successful repair onto canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aip-temporary-readiness-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/accounting_information_platform/persistence.py
          git commit -m "fix: bind readiness to database trigger controls"
          git push origin HEAD:feat/operability-readiness-baseline
