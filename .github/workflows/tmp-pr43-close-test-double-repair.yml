name: PR43 close-package test-double repair

on:
  push:
    branches:
      - feat/reconciliation-run-lifecycle-transition

permissions:
  contents: write

concurrency:
  group: pr43-close-test-double-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      TARGET_BRANCH: feat/reconciliation-run-lifecycle-transition
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard against concurrent writers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${GITHUB_SHA}"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Repair authority-aware test doubles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          authoritative = Path("tests/test_reconciliation_close_package_authoritative_run_red.py")
          replace_once(
              authoritative,
              "from dataclasses import replace\n",
              "from dataclasses import replace\nfrom decimal import Decimal\n",
          )
          replace_once(
              authoritative,
              "        run_loader = mock.Mock(side_effect=load_run)\n        state_loader = mock.Mock(side_effect=load_state)\n",
              '''        run_loader = mock.Mock(side_effect=load_run)\n        projection_loader = mock.Mock(\n            return_value=close_package._DatabaseOwnedCloseProjectionEvidence(\n                statement_population_reference=self.projection.statement_population_reference,\n                book_population_reference=self.projection.book_population_reference,\n                statement_opening_balance=self.projection.bank_closing_balance,\n                statement_period_movements=Decimal("0"),\n                statement_closing_balance=self.projection.bank_closing_balance,\n                book_opening_balance=self.projection.posted_book_cash_balance,\n                posted_cash_book_movements=Decimal("0"),\n                book_closing_balance=self.projection.posted_book_cash_balance,\n                reconciled_book_balance=self.projection.reconciled_balance,\n                outstanding_bank_items=self.projection.outstanding_bank_items,\n                outstanding_book_items=self.projection.outstanding_book_items,\n                unexplained_difference=self.projection.unexplained_difference,\n            )\n        )\n        state_loader = mock.Mock(side_effect=load_state)\n''',
          )
          replace_once(
              authoritative,
              '''            mock.patch.object(\n                close_package,\n                "_database_owned_run_source_evidence",\n                run_loader,\n            ),\n            mock.patch.object(\n                close_package,\n                "_validate_database_owned_exception_state",\n''',
              '''            mock.patch.object(\n                close_package,\n                "_database_owned_run_source_evidence",\n                run_loader,\n            ),\n            mock.patch.object(\n                close_package,\n                "_database_owned_close_projection_evidence",\n                projection_loader,\n            ),\n            mock.patch.object(\n                close_package,\n                "_validate_database_owned_exception_state",\n''',
          )
          replace_once(
              authoritative,
              '''        exception_validator.assert_called_once_with(\n            _Ledger.connection,\n''',
              '''        projection_loader.assert_called_once_with(\n            _Ledger.connection,\n            "tenant-id",\n            reconciliation_run_reference=self.projection.reconciliation_run_reference,\n        )\n        exception_validator.assert_called_once_with(\n            _Ledger.connection,\n''',
          )

          active = Path("tests/test_reconciliation_close_package_active_state_defensive.py")
          replace_once(
              active,
              '''            currency_code="KRW",\n            exception_count=0,\n''',
              '''            currency_code="KRW",\n            statement_population_reference="caller-statement-population",\n            book_population_reference="caller-book-population",\n            bank_closing_balance=0,\n            posted_book_cash_balance=0,\n            reconciled_balance=0,\n            outstanding_bank_items=0,\n            outstanding_book_items=0,\n            unexplained_difference=0,\n            exception_count=0,\n''',
          )
          replace_once(
              active,
              '''        sentinel = object()\n        with (\n''',
              '''        authoritative_projection_evidence = (\n            close_package._DatabaseOwnedCloseProjectionEvidence(\n                statement_population_reference="sha256:" + "3" * 64,\n                book_population_reference="sha256:" + "4" * 64,\n                statement_opening_balance=0,\n                statement_period_movements=0,\n                statement_closing_balance=0,\n                book_opening_balance=0,\n                posted_cash_book_movements=0,\n                book_closing_balance=0,\n                reconciled_book_balance=0,\n                outstanding_bank_items=0,\n                outstanding_book_items=0,\n                unexplained_difference=0,\n            )\n        )\n\n        def replace_projection(projection, **changes):\n            return SimpleNamespace(**({**vars(projection), **changes}))\n\n        sentinel = object()\n        with (\n''',
          )
          replace_once(
              active,
              '''            mock.patch.object(\n                close_package,\n                "_database_owned_run_source_evidence",\n                return_value=(\n                    authoritative_run,\n                    authoritative_artifact,\n                    authoritative_scope,\n                ),\n            ) as run_loader,\n            mock.patch.object(\n                close_package,\n                "_build_reconciliation_close_package_from_verified_state",\n''',
              '''            mock.patch.object(\n                close_package,\n                "_database_owned_run_source_evidence",\n                return_value=(\n                    authoritative_run,\n                    authoritative_artifact,\n                    authoritative_scope,\n                ),\n            ) as run_loader,\n            mock.patch.object(\n                close_package,\n                "_database_owned_close_projection_evidence",\n                return_value=authoritative_projection_evidence,\n            ) as projection_loader,\n            mock.patch.object(\n                close_package,\n                "replace",\n                side_effect=replace_projection,\n            ),\n            mock.patch.object(\n                close_package,\n                "_build_reconciliation_close_package_from_verified_state",\n''',
          )
          replace_once(
              active,
              '''        self.assertEqual(\n            _Ledger.connection.parameters,\n''',
              '''        projection_loader.assert_called_once_with(\n            _Ledger.connection,\n            "tenant-id",\n            reconciliation_run_reference="run-1",\n        )\n        self.assertEqual(\n            _Ledger.connection.parameters,\n''',
          )
          replace_once(
              active,
              '''                ("reconciliation_snapshot_tenant", "tenant-id"),\n                ("reconciliation_match_state", "database-owned:approved"),\n''',
              '''                ("reconciliation_snapshot_tenant", "tenant-id"),\n                ("statement_population", "sha256:" + "3" * 64),\n                ("book_population", "sha256:" + "4" * 64),\n                ("reconciliation_match_state", "database-owned:approved"),\n''',
          )

          provenance = Path("tests/test_reconciliation_close_package_approval_provenance_red.py")
          replace_once(
              provenance,
              '''from accounting_information_platform.reconciliation_read_model import (\n    ReconciliationAllocationEvidence,\n    ReconciliationCloseReviewProjection,\n    ReconciliationReviewedMatch,\n)\n''',
              '''from accounting_information_platform.reconciliation_read_model import (\n    ReconciliationAllocationEvidence,\n    ReconciliationCloseReviewProjection,\n    ReconciliationCloseReviewScope,\n    ReconciliationReviewedMatch,\n)\n''',
          )
          replace_once(
              provenance,
              '''        approval = package_input.approval_evidence[0]\n\n        class Rows:\n''',
              '''        approval = package_input.approval_evidence[0]\n        authoritative_run = next(\n            evidence\n            for evidence in package_input.evidence_references\n            if evidence.evidence_kind_code == "reconciliation_run"\n        )\n        authoritative_artifact = next(\n            evidence\n            for evidence in package_input.evidence_references\n            if evidence.evidence_kind_code == "statement_artifact"\n        )\n        authoritative_scope = ReconciliationCloseReviewScope(\n            tenant_account_reference=package_input.projection.tenant_account_reference,\n            legal_entity_reference=package_input.projection.legal_entity_reference,\n            accounting_book_reference=package_input.projection.accounting_book_reference,\n            bank_account_assignment_reference=(\n                package_input.projection.bank_account_assignment_reference\n            ),\n            currency_code=package_input.projection.currency_code,\n        )\n        authoritative_projection_evidence = (\n            close_package._DatabaseOwnedCloseProjectionEvidence(\n                statement_population_reference="sha256:" + "3" * 64,\n                book_population_reference="sha256:" + "4" * 64,\n                statement_opening_balance=Decimal("100.00"),\n                statement_period_movements=Decimal("0.00"),\n                statement_closing_balance=Decimal("100.00"),\n                book_opening_balance=Decimal("100.00"),\n                posted_cash_book_movements=Decimal("0.00"),\n                book_closing_balance=Decimal("100.00"),\n                reconciled_book_balance=Decimal("100.00"),\n                outstanding_bank_items=Decimal("0.00"),\n                outstanding_book_items=Decimal("0.00"),\n                unexplained_difference=Decimal("0.00"),\n            )\n        )\n\n        class Rows:\n''',
          )
          replace_once(
              provenance,
              '''        with mock.patch.object(close_package, "PostgresPostingLedger", Ledger):\n            with self.assertRaisesRegex(\n''',
              '''        with (\n            mock.patch.object(close_package, "PostgresPostingLedger", Ledger),\n            mock.patch.object(\n                close_package,\n                "_database_owned_run_source_evidence",\n                return_value=(\n                    authoritative_run,\n                    authoritative_artifact,\n                    authoritative_scope,\n                ),\n            ),\n            mock.patch.object(\n                close_package,\n                "_database_owned_close_projection_evidence",\n                return_value=authoritative_projection_evidence,\n            ),\n        ):\n            with self.assertRaisesRegex(\n''',
          )
          PY
      - name: Run repaired close-package contract tests
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_reconciliation_close_package_authoritative_run_red
          tests.test_reconciliation_close_package_active_state_defensive
          tests.test_reconciliation_close_package_approval_provenance_red
      - name: Run full behavior suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove bounded repair workflow and publish canonical commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${GITHUB_SHA}"
          rm -f .github/workflows/tmp-pr43-close-test-double-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_reconciliation_close_package_authoritative_run_red.py \
                  tests/test_reconciliation_close_package_active_state_defensive.py \
                  tests/test_reconciliation_close_package_approval_provenance_red.py \
                  .github/workflows/tmp-pr43-close-test-double-repair.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "test: align close-package doubles with database authority"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
