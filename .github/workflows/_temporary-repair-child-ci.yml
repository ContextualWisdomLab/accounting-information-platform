name: Temporary reconciliation CI repair

on:
  push:
    branches:
      - feat/reconciliation-run-lifecycle-transition

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      EXPECTED_START_SHA: ${{ github.sha }}
      REPAIR_BRANCH: feat/reconciliation-run-lifecycle-transition
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact temporary repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify single-writer lease before repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_START_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${REPAIR_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_START_SHA"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Apply causal test-contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          run_api = Path("tests/test_reconciliation_run_api.py")
          text = run_api.read_text(encoding="utf-8")
          old = '''        source_payload_hash = "sha256:" + hashlib.sha256(fixture).hexdigest()\n        return statement, {\n'''
          new = '''        source_payload_hash = "sha256:" + hashlib.sha256(fixture).hexdigest()\n        with psycopg.connect(posting.DATABASE_URL) as connection:\n            knowledge_cutoff_at = connection.execute(\n                "SELECT clock_timestamp()"\n            ).fetchone()[0]\n        return statement, {\n'''
          if old not in text:
              raise SystemExit("reconciliation-run fixture anchor changed")
          text = text.replace(old, new, 1)
          old_cutoff = '            "knowledge_cutoff_at": "2026-09-01T00:00:00Z",\n'
          new_cutoff = '            "knowledge_cutoff_at": knowledge_cutoff_at.isoformat().replace("+00:00", "Z"),\n'
          if old_cutoff not in text:
              raise SystemExit("default knowledge-cutoff fixture anchor changed")
          run_api.write_text(text.replace(old_cutoff, new_cutoff, 1), encoding="utf-8")

          repaired_doubles = 0
          for path in sorted(Path("tests").glob("test_reconciliation_close_package*.py")):
              source = path.read_text(encoding="utf-8")
              if 'mock.patch.object(close_package, "PostgresPostingLedger"' not in source:
                  continue
              if "    def _session(self):" in source:
                  source = source.replace(
                      "    def _session(self):",
                      "    def _consistent_read_session(self):",
                  )
                  path.write_text(source, encoding="utf-8")
                  repaired_doubles += 1
          if repaired_doubles == 0:
              raise SystemExit("no stale close-package ledger doubles found")

          authoritative = Path("tests/test_reconciliation_close_package_authoritative_exception_red.py")
          source = authoritative.read_text(encoding="utf-8")
          start_marker = "    def test_run_scope_loader_returns_persisted_accounting_scope(self) -> None:\n"
          end_marker = "    def test_open_database_exception_blocks_clean_close_projection(self) -> None:\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("authoritative run-scope test anchor changed")
          replacement = '''    def test_run_scope_loader_rejects_non_reconciled_run(self) -> None:\n        """Close-package source authority must reject an evaluating run."""\n        ledger = self._ledger()\n        with ledger._session() as connection:\n            tenant_account_id = ledger._require_tenant(connection)\n            with self.assertRaisesRegex(ValueError, "must be reconciled"):\n                close_package._database_owned_run_source_evidence(\n                    connection,\n                    tenant_account_id,\n                    tenant_reference=self.fixture.case.policy.tenant_reference,\n                    reconciliation_run_reference=str(self.fixture.run_reference),\n                )\n\n'''
          authoritative.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          docs_contract = Path("tests/test_reconciliation_multi_match_documentation_contract.py")
          source = docs_contract.read_text(encoding="utf-8")
          old_docs = '''        self.assertIn("from migrations `0015` through `0017`", text)\n        self.assertIn("close-package provenance remains open", text)\n        self.assertIn("[delivered in current tree; migration 0015]", text)\n'''
          new_docs = '''        self.assertIn("candidate/match/allocation conservation", text)\n        self.assertIn("Database-owned close projection", text)\n        self.assertIn("Source-addressed on dependency root; exact-head proof pending", text)\n'''
          if old_docs not in source:
              raise SystemExit("product-baseline documentation assertion anchor changed")
          docs_contract.write_text(source.replace(old_docs, new_docs, 1), encoding="utf-8")
          PY
      - name: Run full accounting behavior suite on real PostgreSQL
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate repository and compile tree
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Normalize repair into canonical branch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${REPAIR_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_START_SHA"
          rm .github/workflows/_temporary-repair-child-ci.yml
          git add tests .github/workflows/_temporary-repair-child-ci.yml
          git diff --cached --check
          git config user.name "accounting-information-platform repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: repair reconciliation exact-head regressions"
          git push origin "HEAD:${REPAIR_BRANCH}"
