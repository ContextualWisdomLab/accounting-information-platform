name: Temporary close-package fixture repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: repair fixture normalizer matching' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Normalize close-package fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_reconciliation_close_package_red.py')
          text = path.read_text(encoding='utf-8')
          replacement = "\n".join(
              [
                  "    def _approval_payload_evidence(",
                  "        self,",
                  "        approvals: tuple[ReconciliationApprovalEvidence, ...] | None = None,",
                  "    ) -> tuple[ReconciliationEvidenceReference, ...]:",
                  "        \"\"\"Retain approval payload digests and current approved match-state evidence.\"\"\"",
                  "        approval_evidence = self._approval_evidence() if approvals is None else approvals",
                  "        payload_evidence = tuple(",
                  "            ReconciliationEvidenceReference(",
                  "                evidence_kind_code=\"reconciliation_approval_payload\",",
                  "                evidence_reference=approval.evidence_reference,",
                  "                sha256_digest=approval.source_payload_hash,",
                  "            )",
                  "            for approval in approval_evidence",
                  "        )",
                  "        match_state_evidence = tuple(",
                  "            ReconciliationEvidenceReference(",
                  "                evidence_kind_code=\"reconciliation_match_state\",",
                  "                evidence_reference=f\"{approval.reconciliation_match_reference}:approved\",",
                  "                sha256_digest=approval.reconciliation_snapshot_sha256,",
                  "            )",
                  "            for approval in approval_evidence",
                  "        )",
                  "        return payload_evidence + match_state_evidence",
                  "",
                  "    def _evidence",
              ]
          )
          text, helper_count = re.subn(
              r"(?ms)^    def _approval_payload_evidence\(.*?^    def _evidence",
              replacement,
              text,
          )
          if helper_count != 1:
              raise SystemExit(f'expected one approval helper; found {helper_count}')

          old_kinds = (
              '                *["reconciliation_approval_payload"] * 8,\n'
              '                "reconciliation_run",'
          )
          new_kinds = (
              '                *["reconciliation_approval_payload"] * 8,\n'
              '                *["reconciliation_match_state"] * 8,\n'
              '                "reconciliation_run",'
          )
          if text.count(old_kinds) != 1:
              raise SystemExit('expected one evidence-kind assertion')
          text = text.replace(old_kinds, new_kinds)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/repair-close-package-fixtures.yml
          git diff --check
      - name: Commit normalized fixture on the canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'accounting-platform-repair'
          git config user.email 'accounting-platform-repair@users.noreply.github.com'
          git add tests/test_reconciliation_close_package_red.py .github/workflows/repair-close-package-fixtures.yml
          git commit -m 'test: retain active match-state evidence in close-package fixtures'
          git push origin HEAD:fix/reconciliation-multi-match-conservation
