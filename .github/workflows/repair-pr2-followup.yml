name: Verify PR 2 review repairs

on:
  push:
    branches:
      - agent/accounting-posting-foundation

permissions:
  contents: write

concurrency:
  group: verify-pr2-review-repairs
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/accounting-posting-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Apply the reviewed patch and test-fixture boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path(".github/workflows/repair-pr2-review-cluster.yml")
          workflow_text = workflow_path.read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^          python - <<'PY'\n(?P<body>.*?)^          PY\n",
              workflow_text,
          )
          if match is None:
              raise SystemExit("embedded review repair script is missing")
          embedded = textwrap.dedent(match.group("body"))
          exec(compile(embedded, str(workflow_path), "exec"), {})

          contracts_path = Path("tests/test_repository_contracts.py")
          contracts = contracts_path.read_text(encoding="utf-8")
          invalid = '''            'UPDATE "accounting_core"."general_journal" SET journal_status_code = 'posted';',
          '''
          corrected = '''            "UPDATE \\"accounting_core\\".\\"general_journal\\" SET journal_status_code = 'posted';",
          '''
          if invalid not in contracts:
              raise SystemExit("quoted append-only regression fixture did not match")
          contracts_path.write_text(contracts.replace(invalid, corrected, 1), encoding="utf-8")

          postgres_path = Path("tests/test_postgres_posting.py")
          postgres_tests = postgres_path.read_text(encoding="utf-8")
          ledger_setup = '''        self.ledger = PostgresPostingLedger(
                      DATABASE_URL, tenant_reference=self.policy.tenant_reference
                  )
          '''
          patched_ledger_setup = ledger_setup + '''        self._local_billing_origin_patch = mock.patch(
                      "accounting_information_platform.billing_pull._require_safe_configured_billing_origin"
                  )
                  self._local_billing_origin_patch.start()
                  self.addCleanup(self._local_billing_origin_patch.stop)
          '''
          if postgres_tests.count(ledger_setup) != 1:
              raise SystemExit("PostgreSQL test ledger setup drifted")
          postgres_path.write_text(
              postgres_tests.replace(ledger_setup, patched_ledger_setup, 1),
              encoding="utf-8",
          )

          http_path = Path("tests/test_http_api.py")
          http_tests = http_path.read_text(encoding="utf-8")
          class_marker = "class BillingPullRejectedProposalHttpTests(unittest.TestCase):"
          before, marker, after = http_tests.partition(class_marker)
          if not marker:
              raise SystemExit("Billing pull HTTP test class is missing")
          setup = '''        self.case.setUp()
                  self.addCleanup(self.case.doCleanups)
                  self.addCleanup(self.case.tearDown)
          '''
          patched_setup = setup + '''        self._local_billing_origin_patch = mock.patch(
                      "accounting_information_platform.billing_pull._require_safe_configured_billing_origin"
                  )
                  self._local_billing_origin_patch.start()
                  self.addCleanup(self._local_billing_origin_patch.stop)
          '''
          if setup not in after:
              raise SystemExit("Billing pull HTTP setup drifted")
          after = after.replace(setup, patched_setup, 1)
          http_path.write_text(before + marker + after, encoding="utf-8")
          PY
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce coverage and repository contracts
        run: |
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Remove one-shot workflows and publish repair
        run: |
          rm .github/workflows/repair-pr2-review-cluster.yml
          rm .github/workflows/repair-pr2-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close accounting review safety gaps"
          git push origin HEAD:agent/accounting-posting-foundation
