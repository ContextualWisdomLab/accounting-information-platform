name: PR43 population evidence test repair

on:
  push:
    branches:
      - feat/reconciliation-run-lifecycle-transition

permissions:
  contents: write

concurrency:
  group: pr43-population-evidence-test-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feat/reconciliation-run-lifecycle-transition
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard against concurrent writers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${GITHUB_SHA}"
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Prove exact failure before repair
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/red.out"
          set +e
          python -m unittest -v \
            tests.test_reconciliation_close_package_authoritative_run_red.ReconciliationClosePackageAuthoritativeRunTests.test_public_builder_replaces_caller_provenance_with_database_evidence \
            >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          test "$status" -ne 0
          grep -Fq "sha256_digest must match sha256:<64 lowercase hex characters>" "$output"
      - name: Align projection double with database-owned population digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_reconciliation_close_package_authoritative_run_red.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "                statement_population_reference=self.projection.statement_population_reference,\n",
                  "                statement_population_reference=\"sha256:\" + \"d\" * 64,\n",
              ),
              (
                  "                book_population_reference=self.projection.book_population_reference,\n",
                  "                book_population_reference=\"sha256:\" + \"b\" * 64,\n",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement for {old.strip()!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run repaired focused contract
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_reconciliation_close_package_authoritative_run_red.ReconciliationClosePackageAuthoritativeRunTests.test_public_builder_replaces_caller_provenance_with_database_evidence
      - name: Run full behavior suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish canonical test-only repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${GITHUB_SHA}"
          rm -f .github/workflows/tmp-pr43-population-evidence-test-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_reconciliation_close_package_authoritative_run_red.py \
                  .github/workflows/tmp-pr43-population-evidence-test-repair.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "test: use authoritative reconciliation population digests"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
