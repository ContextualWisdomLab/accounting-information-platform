name: Temporary PR29 database-population GREEN

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-database-population-green.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          fetch-depth: 2
      - name: Verify single-writer parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4ac3f58c6fbab1589e5f3ec69a691c92bfa16353"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
      - name: Install focused test dependencies
        run: python -m pip install -e .
      - name: Prove database-population RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_reconciliation_close_package_database_population_red \
            > /tmp/pr29-database-population-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr29-database-population-red.log
          test "$status" -ne 0
      - name: Apply narrow database-owned population repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/accounting_information_platform/reconciliation_close_package.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from dataclasses import dataclass\n", "from dataclasses import dataclass, replace\n", 1)

          anchor = '''@dataclass(frozen=True, slots=True)\nclass ReconciliationEvidenceReference:\n'''
          insertion = '''@dataclass(frozen=True, slots=True)\nclass _DatabaseOwnedCloseProjectionEvidence:\n    """Exact source-population and monetary facts reconstructed from PostgreSQL."""\n\n    statement_population_reference: str\n    book_population_reference: str\n    statement_opening_balance: Decimal\n    statement_period_movements: Decimal\n    statement_closing_balance: Decimal\n    book_opening_balance: Decimal\n    posted_cash_book_movements: Decimal\n    book_closing_balance: Decimal\n    reconciled_book_balance: Decimal\n    outstanding_bank_items: Decimal\n    outstanding_book_items: Decimal\n    unexplained_difference: Decimal\n\n\ndef _signed_bank_amount(amount: object, credit_debit_code: object, *, reversed_entry: bool = False) -> Decimal:\n    """Return one bank movement/balance with account-owner sign semantics."""\n    exact = Decimal(str(amount))\n    if str(credit_debit_code) == "CRDT":\n        signed = exact\n    elif str(credit_debit_code) == "DBIT":\n        signed = exact.copy_negate()\n    else:\n        raise ValueError("database-owned bank evidence must use CRDT or DBIT direction")\n    return signed.copy_negate() if reversed_entry else signed\n\n\ndef _population_sha256(kind: str, rows: tuple[tuple[str, ...], ...]) -> str:\n    """Hash one canonically ordered immutable source population."""\n    payload = json.dumps(\n        {"population_kind": kind, "rows": rows},\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode("utf-8")\n    return "sha256:" + hashlib.sha256(payload).hexdigest()\n\n\ndef _database_owned_close_projection_evidence(\n    connection: object,\n    tenant_account_id: object,\n    *,\n    reconciliation_run_reference: str,\n) -> _DatabaseOwnedCloseProjectionEvidence:\n    """Reconstruct the exact fully matched close population from immutable database facts."""\n    scope_rows = connection.execute(\n        """\n        SELECT statement.bank_statement_record_id::text,\n               statement.opening_balance_hash,\n               statement.closing_balance_hash,\n               statement.period_start_at,\n               statement.period_end_at,\n               run_record.book_cutoff_at::date,\n               run_record.knowledge_cutoff_at,\n               assignment.chart_account_id::text,\n               run_record.currency_code\n        FROM accounting_core.reconciliation_run AS run_record\n        JOIN accounting_core.reconciliation_run_command AS run_command\n          ON run_command.tenant_account_id = run_record.tenant_account_id\n         AND run_command.reconciliation_run_id = run_record.reconciliation_run_id\n        JOIN accounting_integration.bank_statement_record AS statement\n          ON statement.tenant_account_id = run_command.tenant_account_id\n         AND statement.bank_statement_record_id = run_command.bank_statement_record_id\n        JOIN accounting_core.bank_account_assignment AS assignment\n          ON assignment.tenant_account_id = run_record.tenant_account_id\n         AND assignment.bank_account_assignment_id = run_record.bank_account_assignment_id\n        WHERE run_record.tenant_account_id = %s\n          AND run_record.reconciliation_run_id::text = %s\n        FOR SHARE OF statement, assignment\n        """,\n        (tenant_account_id, reconciliation_run_reference),\n    ).fetchall()\n    if len(scope_rows) != 1:\n        raise ValueError("database-owned close source scope must resolve exactly one statement and cash account")\n    (\n        statement_record_id,\n        opening_balance_hash,\n        closing_balance_hash,\n        statement_period_start_at,\n        _statement_period_end_at,\n        book_cutoff_date,\n        knowledge_cutoff_at,\n        chart_account_id,\n        currency_code,\n    ) = scope_rows[0]\n    if opening_balance_hash is None or closing_balance_hash is None or statement_period_start_at is None:\n        raise ValueError("database-owned close source requires exact statement opening/closing balances and period start")\n\n    balance_rows = connection.execute(\n        """\n        SELECT balance.source_balance_hash,\n               balance.balance_amount,\n               balance.balance_currency_code,\n               balance.credit_debit_code\n        FROM accounting_integration.bank_statement_balance AS balance\n        WHERE balance.tenant_account_id = %s\n          AND balance.bank_statement_record_id::text = %s\n          AND balance.source_balance_hash IN (%s, %s)\n          AND balance.recorded_at <= %s\n        ORDER BY balance.balance_sequence_number, balance.bank_statement_balance_id\n        FOR SHARE OF balance\n        """,\n        (\n            tenant_account_id,\n            str(statement_record_id),\n            str(opening_balance_hash),\n            str(closing_balance_hash),\n            knowledge_cutoff_at,\n        ),\n    ).fetchall()\n    balances = {str(row[0]): row for row in balance_rows}\n    if set(balances) != {str(opening_balance_hash), str(closing_balance_hash)}:\n        raise ValueError("database-owned statement opening and closing balance evidence must both be present")\n    if any(str(row[2]) != str(currency_code) for row in balance_rows):\n        raise ValueError("database-owned statement balances must use the reconciliation currency")\n    statement_opening = _signed_bank_amount(balances[str(opening_balance_hash)][1], balances[str(opening_balance_hash)][3])\n    statement_closing = _signed_bank_amount(balances[str(closing_balance_hash)][1], balances[str(closing_balance_hash)][3])\n\n    entry_rows = connection.execute(\n        """\n        SELECT COALESCE(NULLIF(entry.source_entry_identity, ''), entry.bank_statement_entry_id::text),\n               entry.entry_sequence_number,\n               entry.entry_amount,\n               entry.entry_currency_code,\n               entry.credit_debit_code,\n               entry.reversal_indicator,\n               entry.source_entry_hash\n        FROM accounting_integration.bank_statement_entry AS entry\n        WHERE entry.tenant_account_id = %s\n          AND entry.bank_statement_record_id::text = %s\n          AND entry.recorded_at <= %s\n        ORDER BY entry.entry_sequence_number, entry.bank_statement_entry_id\n        FOR SHARE OF entry\n        """,\n        (tenant_account_id, str(statement_record_id), knowledge_cutoff_at),\n    ).fetchall()\n    if not entry_rows:\n        raise ValueError("database-owned statement population must contain at least one immutable entry")\n    if any(str(row[3]) != str(currency_code) for row in entry_rows):\n        raise ValueError("database-owned statement entries must use the reconciliation currency")\n    statement_amounts = {\n        str(row[0]): abs(Decimal(str(row[2]))) for row in entry_rows\n    }\n    if len(statement_amounts) != len(entry_rows):\n        raise ValueError("database-owned statement population identities must be unique")\n    statement_movements = _exact_decimal_sum(\n        *(\n            _signed_bank_amount(row[2], row[4], reversed_entry=bool(row[5]))\n            for row in entry_rows\n        )\n    )\n    if _exact_decimal_sum(statement_opening, statement_movements) != statement_closing:\n        raise ValueError("database-owned statement opening plus movements must equal closing balance")\n\n    journal_rows = connection.execute(\n        """\n        SELECT journal.journal_reference,\n               journal.accounting_date,\n               journal.posted_at,\n               line.line_number,\n               line.debit_amount,\n               line.credit_amount,\n               journal.transaction_currency_code\n        FROM accounting_core.journal_entry_line AS line\n        JOIN accounting_core.general_journal AS journal\n          ON journal.tenant_account_id = line.tenant_account_id\n         AND journal.general_journal_id = line.general_journal_id\n        WHERE line.tenant_account_id = %s\n          AND line.chart_account_id::text = %s\n          AND journal.accounting_date <= %s\n          AND journal.posted_at <= %s\n        ORDER BY journal.accounting_date, journal.posted_at,\n                 journal.journal_reference, line.line_number\n        FOR SHARE OF journal, line\n        """,\n        (tenant_account_id, str(chart_account_id), book_cutoff_date, knowledge_cutoff_at),\n    ).fetchall()\n    if any(str(row[6]) != str(currency_code) for row in journal_rows):\n        raise ValueError("database-owned cash journal population must use the reconciliation currency")\n    period_start_date = statement_period_start_at.date()\n    journal_net: dict[str, Decimal] = {}\n    book_opening_parts: list[Decimal] = []\n    book_period_parts: list[Decimal] = []\n    for row in journal_rows:\n        amount = _exact_decimal_sum(Decimal(str(row[4])), Decimal(str(row[5])).copy_negate())\n        journal_net[str(row[0])] = _exact_decimal_sum(journal_net.get(str(row[0]), Decimal("0")), amount)\n        if row[1] < period_start_date:\n            book_opening_parts.append(amount)\n        else:\n            book_period_parts.append(amount)\n    book_opening = _exact_decimal_sum(*(book_opening_parts or [Decimal("0")]))\n    book_movements = _exact_decimal_sum(*(book_period_parts or [Decimal("0")]))\n    book_closing = _exact_decimal_sum(book_opening, book_movements)\n\n    statement_allocation_rows = connection.execute(\n        """\n        SELECT allocation.statement_entry_reference, allocation.allocated_amount\n        FROM accounting_core.statement_match_allocation AS allocation\n        JOIN accounting_core.reconciliation_match AS match\n          ON match.tenant_account_id = allocation.tenant_account_id\n         AND match.reconciliation_run_id = allocation.reconciliation_run_id\n         AND match.reconciliation_match_id = allocation.reconciliation_match_id\n        WHERE allocation.tenant_account_id = %s\n          AND allocation.reconciliation_run_id::text = %s\n          AND match.match_status_code = 'approved'\n        ORDER BY allocation.statement_entry_reference, allocation.reconciliation_allocation_id\n        FOR SHARE OF match, allocation\n        """,\n        (tenant_account_id, reconciliation_run_reference),\n    ).fetchall()\n    journal_allocation_rows = connection.execute(\n        """\n        SELECT allocation.journal_reference, allocation.allocated_amount\n        FROM accounting_core.journal_match_allocation AS allocation\n        JOIN accounting_core.reconciliation_match AS match\n          ON match.tenant_account_id = allocation.tenant_account_id\n         AND match.reconciliation_run_id = allocation.reconciliation_run_id\n         AND match.reconciliation_match_id = allocation.reconciliation_match_id\n        WHERE allocation.tenant_account_id = %s\n          AND allocation.reconciliation_run_id::text = %s\n          AND match.match_status_code = 'approved'\n        ORDER BY allocation.journal_reference, allocation.reconciliation_allocation_id\n        FOR SHARE OF match, allocation\n        """,\n        (tenant_account_id, reconciliation_run_reference),\n    ).fetchall()\n    statement_allocated: dict[str, Decimal] = {}\n    for reference, amount in statement_allocation_rows:\n        statement_allocated[str(reference)] = _exact_decimal_sum(\n            statement_allocated.get(str(reference), Decimal("0")), Decimal(str(amount))\n        )\n    if set(statement_allocated) != set(statement_amounts) or any(\n        statement_allocated[reference] != amount\n        for reference, amount in statement_amounts.items()\n    ):\n        raise ValueError("database-owned reconciled run requires complete approved statement-source allocation")\n\n    period_journal_amounts = {\n        reference: abs(amount)\n        for reference, amount in journal_net.items()\n        if amount != 0\n        and any(str(row[0]) == reference and row[1] >= period_start_date for row in journal_rows)\n    }\n    journal_allocated: dict[str, Decimal] = {}\n    for reference, amount in journal_allocation_rows:\n        journal_allocated[str(reference)] = _exact_decimal_sum(\n            journal_allocated.get(str(reference), Decimal("0")), Decimal(str(amount))\n        )\n    if set(journal_allocated) != set(period_journal_amounts) or any(\n        journal_allocated[reference] != amount\n        for reference, amount in period_journal_amounts.items()\n    ):\n        raise ValueError("database-owned reconciled run requires complete approved cash-journal allocation")\n\n    if book_closing != statement_closing:\n        raise ValueError("database-owned book-to-bank bridge must close exactly before reconciled close evidence")\n\n    statement_population_rows = tuple(\n        (str(row[0]), str(row[1]), str(row[2]), str(row[3]), str(row[4]), str(bool(row[5])).lower(), str(row[6]))\n        for row in entry_rows\n    )\n    book_population_rows = tuple(\n        (str(row[0]), str(row[1]), str(row[2]), str(row[3]), str(row[4]), str(row[5]), str(row[6]))\n        for row in journal_rows\n    )\n    return _DatabaseOwnedCloseProjectionEvidence(\n        statement_population_reference=_population_sha256("bank_statement_entries:v1", statement_population_rows),\n        book_population_reference=_population_sha256("cash_journal_lines:v1", book_population_rows),\n        statement_opening_balance=statement_opening,\n        statement_period_movements=statement_movements,\n        statement_closing_balance=statement_closing,\n        book_opening_balance=book_opening,\n        posted_cash_book_movements=book_movements,\n        book_closing_balance=book_closing,\n        reconciled_book_balance=book_closing,\n        outstanding_bank_items=Decimal("0"),\n        outstanding_book_items=Decimal("0"),\n        unexplained_difference=Decimal("0"),\n    )\n\n\n'''
          if anchor not in text:
              raise SystemExit("close-package dataclass anchor changed")
          text = text.replace(anchor, insertion + anchor, 1)

          old = '''        authoritative_state = _database_owned_match_state_evidence(\n            connection,\n            tenant_account_id,\n            tenant_reference=tenant_reference,\n            reconciliation_run_reference=package_input.projection.reconciliation_run_reference,\n            approval_evidence=package_input.approval_evidence,\n        )\n        projection_scope = ReconciliationCloseReviewScope(\n            tenant_account_reference=package_input.projection.tenant_account_reference,\n'''
          new = '''        authoritative_projection_evidence = _database_owned_close_projection_evidence(\n            connection,\n            tenant_account_id,\n            reconciliation_run_reference=package_input.projection.reconciliation_run_reference,\n        )\n        authoritative_state = _database_owned_match_state_evidence(\n            connection,\n            tenant_account_id,\n            tenant_reference=tenant_reference,\n            reconciliation_run_reference=package_input.projection.reconciliation_run_reference,\n            approval_evidence=package_input.approval_evidence,\n        )\n        authoritative_projection = replace(\n            package_input.projection,\n            statement_population_reference=(\n                authoritative_projection_evidence.statement_population_reference\n            ),\n            book_population_reference=authoritative_projection_evidence.book_population_reference,\n            bank_closing_balance=authoritative_projection_evidence.statement_closing_balance,\n            posted_book_cash_balance=authoritative_projection_evidence.book_closing_balance,\n            reconciled_balance=authoritative_projection_evidence.reconciled_book_balance,\n            outstanding_bank_items=authoritative_projection_evidence.outstanding_bank_items,\n            outstanding_book_items=authoritative_projection_evidence.outstanding_book_items,\n            unexplained_difference=authoritative_projection_evidence.unexplained_difference,\n        )\n        projection_scope = ReconciliationCloseReviewScope(\n            tenant_account_reference=authoritative_projection.tenant_account_reference,\n'''
          if old not in text:
              raise SystemExit("authority integration anchor changed")
          text = text.replace(old, new, 1)
          text = text.replace("legal_entity_reference=package_input.projection.legal_entity_reference,\n", "legal_entity_reference=authoritative_projection.legal_entity_reference,\n", 1)
          text = text.replace("accounting_book_reference=package_input.projection.accounting_book_reference,\n", "accounting_book_reference=authoritative_projection.accounting_book_reference,\n", 1)
          text = text.replace("package_input.projection.bank_account_assignment_reference\n", "authoritative_projection.bank_account_assignment_reference\n", 1)
          text = text.replace("currency_code=package_input.projection.currency_code,\n", "currency_code=authoritative_projection.currency_code,\n", 1)
          text = text.replace("projection=package_input.projection,\n        )\n", "projection=authoritative_projection,\n        )\n", 1)

          old = '''            if evidence.evidence_kind_code\n            not in {\n                "reconciliation_run",\n                "statement_artifact",\n                "reconciliation_match_state",\n                _SNAPSHOT_TENANT_EVIDENCE_KIND,\n            }\n        )\n        verified_input = ReconciliationClosePackageInput(\n            projection=package_input.projection,\n'''
          new = '''            if evidence.evidence_kind_code\n            not in {\n                "reconciliation_run",\n                "statement_artifact",\n                "statement_population",\n                "book_population",\n                "reconciliation_match_state",\n                _SNAPSHOT_TENANT_EVIDENCE_KIND,\n            }\n        )\n        authoritative_populations = (\n            ReconciliationEvidenceReference(\n                evidence_kind_code="statement_population",\n                evidence_reference=authoritative_projection_evidence.statement_population_reference,\n                sha256_digest=authoritative_projection_evidence.statement_population_reference,\n            ),\n            ReconciliationEvidenceReference(\n                evidence_kind_code="book_population",\n                evidence_reference=authoritative_projection_evidence.book_population_reference,\n                sha256_digest=authoritative_projection_evidence.book_population_reference,\n            ),\n        )\n        verified_input = ReconciliationClosePackageInput(\n            projection=authoritative_projection,\n'''
          if old not in text:
              raise SystemExit("retained evidence anchor changed")
          text = text.replace(old, new, 1)
          old = '''                    authoritative_snapshot_tenant,\n                )\n                + authoritative_state\n'''
          new = '''                    authoritative_snapshot_tenant,\n                )\n                + authoritative_populations\n                + authoritative_state\n'''
          if old not in text:
              raise SystemExit("verified evidence composition anchor changed")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          adr = Path("docs/adr/0056-reconciliation-close-package-provenance.md")
          text = adr.read_text(encoding="utf-8")
          marker = '''For reconciliation exceptions, the builder reads the complete `accounting_core.reconciliation_exception` population for the same tenant/run under a shared lock'''
          paragraph = '''For the statement and book populations, the builder reconstructs the immutable statement-entry population, exact opening and closing statement balances, cash-account journal-line population through the run cutoffs, and active-approved allocation consumption from PostgreSQL. Authority-built `statement_population` and `book_population` digests are derived from those canonically ordered rows rather than retained from caller evidence. In the current bounded `reconciled` contract, every statement source and every in-period cash-journal source must be fully consumed by active approved allocations and the exact cash-book closing balance must equal the exact statement closing balance. Runs with timing differences remain review work and cannot be promoted to `reconciled` close evidence by caller-shaped bridge values.\n\n'''
          if marker not in text:
              raise SystemExit("ADR population marker changed")
          text = text.replace(marker, paragraph + marker, 1)
          adr.write_text(text, encoding="utf-8")
          PY
      - name: Run focused GREEN validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/accounting_information_platform/reconciliation_close_package.py
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_reconciliation_close_package_database_population_red \
            tests.test_reconciliation_close_package_authoritative_run_helper_red \
            tests.test_reconciliation_close_package_authoritative_run_red \
            tests.test_reconciliation_close_package_authoritative_exception_red \
            tests.test_reconciliation_close_package_authoritative_documentation_contract
      - name: Normalize canonical branch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pr29-database-population-green.yml
          git add src/accounting_information_platform/reconciliation_close_package.py \
                  docs/adr/0056-reconciliation-close-package-provenance.md
          git diff --cached --check
          git config user.name "accounting-platform-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: derive close populations from database facts"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
