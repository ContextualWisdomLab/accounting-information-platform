name: Normalize PR30 approval evidence

on:
  push:
    branches:
      - feat/reconciliation-approval-evidence

permissions:
  contents: write

concurrency:
  group: normalize-pr30-approval-evidence
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      RED_SHA: d024acca20998cb1006d2c13ef16058fd211d672
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: feat/reconciliation-approval-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Verify helper-only delta from observed RED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only "$RED_SHA" "$GITHUB_SHA" > /tmp/helper-diff.txt
          cat /tmp/helper-diff.txt
          test "$(wc -l < /tmp/helper-diff.txt)" -eq 2
          grep -Fxq '.github/workflows/normalize-pr30-approval-evidence.yml' /tmp/helper-diff.txt
          grep -Fxq 'scripts/normalize_pr30_approval_evidence.py' /tmp/helper-diff.txt
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Materialize narrow GREEN repair
        run: python scripts/normalize_pr30_approval_evidence.py
      - name: Run focused PostgreSQL and install-contract validation
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_reconciliation_approval_evidence_red \
            tests.test_reconciliation_candidate_allocation_persistence_red \
            tests.test_reconciliation_cross_run_conservation_red \
            tests.test_reconciliation_append_only_evidence_red \
            tests.test_foundation_install_manifest_contract
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Normalize into canonical branch and remove helper machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-pr30-approval-evidence.yml
          rm -f scripts/normalize_pr30_approval_evidence.py
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'seonghobae'
          git config user.email 'seonghobae@users.noreply.github.com'
          git commit -m 'feat: persist reconciliation approval evidence'
          git fetch origin feat/reconciliation-approval-evidence
          test "$(git rev-parse origin/feat/reconciliation-approval-evidence)" = "$GITHUB_SHA"
          git push origin HEAD:feat/reconciliation-approval-evidence
