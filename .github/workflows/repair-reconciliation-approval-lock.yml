name: Temporary reconciliation approval-lock repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/repair-reconciliation-approval-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out triggering branch head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: fix/reconciliation-multi-match-conservation
          fetch-depth: 0
      - name: Verify trigger head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Apply bounded database-owned serialization repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path("database/migrations/0015_reconciliation_multi_match_conservation.sql")
          text = migration.read_text()
          old = """    WHERE match.tenant_account_id = NEW.tenant_account_id\n      AND match.reconciliation_run_id = NEW.reconciliation_run_id\n      AND match.reconciliation_match_id = NEW.reconciliation_match_id;\n\n    IF NOT FOUND THEN\n        RAISE EXCEPTION\n            'allocation match is outside the tenant reconciliation run (reconciliation_scope_mismatch)'\n"""
          new = """    WHERE match.tenant_account_id = NEW.tenant_account_id\n      AND match.reconciliation_run_id = NEW.reconciliation_run_id\n      AND match.reconciliation_match_id = NEW.reconciliation_match_id\n    FOR UPDATE OF match;\n\n    IF NOT FOUND THEN\n        RAISE EXCEPTION\n            'allocation match is outside the tenant reconciliation run (reconciliation_scope_mismatch)'\n"""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one allocation-parent lookup boundary")
          migration.write_text(text.replace(old, new, 1))

          adr = Path("docs/adr/0054-deterministic-bank-reconciliation-proposals.md")
          text = adr.read_text()
          old = """Allocation rows may be inserted only while their match remains `proposed`; once a match enters `approved`, `rejected`, or `superseded`, its reviewed allocation population is frozen even when unused source capacity remains. Corrections therefore use new evidence plus an explicit match-state transition rather than extending or rewriting reconciliation history.\n"""
          new = """Allocation rows may be inserted only while their match remains `proposed`; once a match enters `approved`, `rejected`, or `superseded`, its reviewed allocation population is frozen even when unused source capacity remains. Allocation admission locks the parent `reconciliation_match` row, so a concurrent allocation cannot cross an uncommitted `proposed → approved` snapshot boundary: whichever transaction acquires that row first completes before the other re-evaluates the current match state. Corrections therefore use new evidence plus an explicit match-state transition rather than extending or rewriting reconciliation history.\n"""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one ADR allocation-freeze paragraph")
          text = text.replace(old, new, 1)
          old_ref = """See `docs/doctoring/REFERENCES.md` for APA 7 entries covering ISO 20022-1:2026, ISO 20022-4:2026, ISO 20022-9:2026, and the ISO 20022 Registration Authority `camt.053.001.14` catalogue.\n"""
          new_ref = """See `docs/doctoring/REFERENCES.md` for APA 7 entries covering ISO 20022-1:2026, ISO 20022-4:2026, ISO 20022-9:2026, the ISO 20022 Registration Authority `camt.053.001.14` catalogue, and PostgreSQL 18 explicit locking used for the approval/allocation serialization boundary.\n"""
          if text.count(old_ref) != 1:
              raise SystemExit("expected exactly one ADR references sentence")
          adr.write_text(text.replace(old_ref, new_ref, 1))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          old = """Allocation rows may be inserted only while the match is `proposed`; after `approved`, `rejected`, or `superseded`, the reviewed allocation population is frozen and corrections require new/superseding evidence. Allocations remain reviewed evidence with no posting, reversal, close, or accounting-policy authority. ADR 0054 records the boundary."""
          new = """Allocation rows may be inserted only while the match is `proposed`; allocation admission row-locks the parent match so a concurrent insert cannot cross an uncommitted approval snapshot; after `approved`, `rejected`, or `superseded`, the reviewed allocation population is frozen and corrections require new/superseding evidence. Allocations remain reviewed evidence with no posting, reversal, close, or accounting-policy authority. ADR 0054 records the boundary."""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unreleased reconciliation persistence entry")
          changelog.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary repair machinery and commit canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-reconciliation-approval-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/migrations/0015_reconciliation_multi_match_conservation.sql docs/adr/0054-deterministic-bank-reconciliation-proposals.md CHANGELOG.md
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/repair-reconciliation-approval-lock.yml\nCHANGELOG.md\ndatabase/migrations/0015_reconciliation_multi_match_conservation.sql\ndocs/adr/0054-deterministic-bank-reconciliation-proposals.md'
          git commit -m "fix: serialize reconciliation allocation approval"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
