name: Temporary PR29 run-status authority repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-run-status-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify single-writer parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8128dd92c1cb8f9972470ae3826ad0823d5ac501"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
      - name: Install test dependencies
        run: python -m pip install -e .
      - name: Write RED run-status regression and prove predecessor failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_reconciliation_close_package_authoritative_run_helper_red.py")
          text = path.read_text()
          old = '''    def _row(\n        self,\n        *,\n        command_source_hash: str | None = None,\n'''
          new = '''    def _row(\n        self,\n        *,\n        run_status_code: str = "reconciled",\n        command_source_hash: str | None = None,\n'''
          if old not in text:
              raise SystemExit("run helper signature anchor changed")
          text = text.replace(old, new, 1)
          old = '''        return (\n            self.cutoff,\n            self.command_digest,\n'''
          new = '''        return (\n            self.cutoff,\n            run_status_code,\n            self.command_digest,\n'''
          if old not in text:
              raise SystemExit("run helper row anchor changed")
          text = text.replace(old, new, 1)
          old = '''        self.assertIn("reconciliation_run_command", query)\n'''
          new = '''        self.assertIn("reconciliation_run_command", query)\n        self.assertIn("run_record.run_status_code", query)\n'''
          if old not in text:
              raise SystemExit("run helper query assertion anchor changed")
          text = text.replace(old, new, 1)
          anchor = '''    def test_loader_rejects_missing_run_command_or_artifact(self) -> None:\n'''
          addition = '''    def test_loader_rejects_non_reconciled_run_status(self) -> None:\n        """Authority-bearing close packages require a locked reconciled run."""\n        for run_status_code in (\n            "evaluating",\n            "review_required",\n            "not_reconciled",\n            "superseded",\n        ):\n            with self.subTest(run_status_code=run_status_code):\n                with self.assertRaisesRegex(\n                    ValueError,\n                    "database-owned reconciliation run must be reconciled",\n                ):\n                    self._load([self._row(run_status_code=run_status_code)])\n\n'''
          if anchor not in text:
              raise SystemExit("run helper test insertion anchor changed")
          text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text)
          PY
          set +e
          PYTHONPATH=src:. python -m unittest -v tests.test_reconciliation_close_package_authoritative_run_helper_red > /tmp/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/red.log
          test "$red_status" -ne 0
          grep -Eq "run_status_code|too many values to unpack|must be reconciled" /tmp/red.log
      - name: Apply narrow run-status authority fix and ADR contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/accounting_information_platform/reconciliation_close_package.py")
          text = source.read_text()
          old = '''        SELECT run_record.knowledge_cutoff_at,\n               run_command.reconciliation_command_hash,\n'''
          new = '''        SELECT run_record.knowledge_cutoff_at,\n               run_record.run_status_code,\n               run_command.reconciliation_command_hash,\n'''
          if old not in text:
              raise SystemExit("run query select anchor changed")
          text = text.replace(old, new, 1)
          old = '''    (\n        knowledge_cutoff_at,\n        reconciliation_command_hash,\n'''
          new = '''    (\n        knowledge_cutoff_at,\n        run_status_code,\n        reconciliation_command_hash,\n'''
          if old not in text:
              raise SystemExit("run unpack anchor changed")
          text = text.replace(old, new, 1)
          old = '''    ) = rows[0]\n    if not hmac.compare_digest(str(command_source_hash), str(statement_source_hash)):\n'''
          new = '''    ) = rows[0]\n    if str(run_status_code) != "reconciled":\n        raise ValueError(\n            "database-owned reconciliation run must be reconciled before close-package construction"\n        )\n    if not hmac.compare_digest(str(command_source_hash), str(statement_source_hash)):\n'''
          if old not in text:
              raise SystemExit("run status validation anchor changed")
          text = text.replace(old, new, 1)
          source.write_text(text)

          adr = Path("docs/adr/0056-reconciliation-close-package-provenance.md")
          text = adr.read_text()
          old = '''For the reconciliation run, the builder reads `accounting_core.reconciliation_run` joined to `accounting_core.reconciliation_run_command`, `accounting_integration.bank_statement_record`, `accounting_integration.bank_statement_artifact`, `accounting_core.legal_entity_record`, and `accounting_core.accounting_book` under shared locks. It requires exactly one run command and one retained bank-statement artifact, requires the command source hash to match the statement record and artifact hash, and requires the command source reference to match the retained artifact-store reference. It derives the package's run digest, cutoff, statement-artifact digest/reference, legal-entity code, accounting-book name, bank-account-assignment identity, and currency from those database-owned rows. The reconstructed tenant/entity/book/bank-assignment/currency scope must exactly equal the close-review projection scope. Caller-provided `knowledge_cutoff`, reconciliation scope, `reconciliation_run` evidence, or `statement_artifact` evidence that differs from PostgreSQL therefore fails closed.\n'''
          new = '''For the reconciliation run, the builder reads `accounting_core.reconciliation_run` joined to `accounting_core.reconciliation_run_command`, `accounting_integration.bank_statement_record`, `accounting_integration.bank_statement_artifact`, `accounting_core.legal_entity_record`, and `accounting_core.accounting_book` while taking an update lock on the authoritative run row and shared locks on joined evidence rows. It requires exactly one run command and one retained bank-statement artifact, requires the locked database-owned `run_status_code` to be exactly `reconciled`, requires the command source hash to match the statement record and artifact hash, and requires the command source reference to match the retained artifact-store reference. `evaluating`, `review_required`, `not_reconciled`, and `superseded` runs fail closed before child match/exception evidence can become an authority-bearing close package. It derives the package's run digest, cutoff, statement-artifact digest/reference, legal-entity code, accounting-book name, bank-account-assignment identity, and currency from those database-owned rows. The reconstructed tenant/entity/book/bank-assignment/currency scope must exactly equal the close-review projection scope. Caller-provided `knowledge_cutoff`, reconciliation scope, `reconciliation_run` evidence, or `statement_artifact` evidence that differs from PostgreSQL therefore fails closed.\n'''
          if old not in text:
              raise SystemExit("ADR run authority paragraph anchor changed")
          text = text.replace(old, new, 1)
          adr.write_text(text)
          PY
      - name: Run focused GREEN validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_reconciliation_close_package_authoritative_run_helper_red \
            tests.test_reconciliation_close_package_authoritative_run_red \
            tests.test_reconciliation_close_package_authoritative_exception_red
      - name: Normalize canonical branch commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pr29-run-status-repair.yml
          git add src/accounting_information_platform/reconciliation_close_package.py \
                  tests/test_reconciliation_close_package_authoritative_run_helper_red.py \
                  docs/adr/0056-reconciliation-close-package-provenance.md
          git diff --cached --check
          git config user.name "accounting-platform-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: require reconciled run for close evidence"
          git fetch origin fix/reconciliation-multi-match-conservation
          test "$(git rev-parse origin/fix/reconciliation-multi-match-conservation)" = "$GITHUB_SHA"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
