name: Repair PR 2 command contracts

on:
  push:
    branches:
      - agent/accounting-posting-foundation

permissions:
  contents: write

concurrency:
  group: repair-pr2-command-contracts
  cancel-in-progress: true

jobs:
  repair-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      REPAIR_SOURCE_SHA: 42885b53deb5325bd8d31fa43a819814969983bd
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/accounting-posting-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Apply exact command idempotency repair
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${REPAIR_SOURCE_SHA}^{commit}"
          git show "${REPAIR_SOURCE_SHA}:scripts/repair_pr2_command_idempotency.py" > /tmp/repair_pr2_command_idempotency.py
          python /tmp/repair_pr2_command_idempotency.py
          python - <<'PY'
          from pathlib import Path
          import re

          test_path = Path("tests/test_postgres_posting.py")
          text = test_path.read_text(encoding="utf-8")

          helper_pattern = re.compile(
              r"(?ms)^    def _raw_insert_general_journal\(self, journal_reference: str\) -> None:\n"
              r".*?(?=^    def _close_period\()"
          )
          helper = helper_pattern.search(text)
          if helper is None:
              raise SystemExit("raw journal helper drifted")
          helper_text = helper.group(0)
          commit_anchor = "            connection.commit()\n"
          if commit_anchor not in helper_text:
              raise SystemExit("raw journal helper commit anchor drifted")
          balanced_tail = '''            journal_id = connection.execute(
                """
                SELECT general_journal_id
                FROM accounting_core.general_journal
                WHERE tenant_account_id = %s AND journal_reference = %s
                """,
                (self.tenant_id, journal_reference),
            ).fetchone()[0]
            account_ids = dict(
                connection.execute(
                    """
                    SELECT chart_account_code, chart_account_id
                    FROM accounting_core.chart_account
                    WHERE tenant_account_id = %s
                      AND chart_account_code IN ('110100', '410100')
                      AND valid_to IS NULL
                    """,
                    (self.tenant_id,),
                ).fetchall()
            )
            connection.execute(
                """
                INSERT INTO accounting_core.journal_entry_line (
                    tenant_account_id, general_journal_id, line_number,
                    chart_account_id, account_role_code, debit_amount, credit_amount
                )
                VALUES
                    (%s, %s, 1, %s, 'accounts_receivable', 1, 0),
                    (%s, %s, 2, %s, 'usage_revenue', 0, 1)
                """,
                (
                    self.tenant_id,
                    journal_id,
                    account_ids['110100'],
                    self.tenant_id,
                    journal_id,
                    account_ids['410100'],
                ),
            )
            connection.commit()
'''
          helper_text = helper_text.replace(commit_anchor, balanced_tail, 1)
          text = text[: helper.start()] + helper_text + text[helper.end() :]

          unbalanced_pattern = re.compile(
              r"(?ms)^    def test_hard_close_rejects_unbalanced_trial_balance\(self\) -> None:\n"
              r".*?(?=^    def test_post_proposal_resolves_catalog_policy_from_billing_ingest\()"
          )
          unbalanced = unbalanced_pattern.search(text)
          if unbalanced is None:
              raise SystemExit("unbalanced close test drifted")
          replacement = '''    def test_database_rejects_unbalanced_journal_before_close(self) -> None:
        """The durable journal boundary rejects imbalance before close can observe it."""
        self.ledger.post(self._two_line_proposal(), self.policy)
        with self.assertRaisesRegex(psycopg.Error, "journal_unbalanced"):
            self._insert_unbalanced_receivable_debit()
        self.assertEqual(self._period_status("2026-08"), "open")
        self.assertEqual(self._count_closing_journals(), 0)
        self.assertEqual(
            self._count_table("accounting_reporting.trial_balance_snapshot"), 0
        )

'''
          text = text[: unbalanced.start()] + replacement + text[unbalanced.end() :]
          test_path.write_text(text, encoding="utf-8")

          migration_path = Path("database/migrations/0003_home_tax_submission.sql")
          migration = migration_path.read_text(encoding="utf-8")
          marker = "ALTER TABLE accounting_integration.home_tax_submission ENABLE ROW LEVEL SECURITY;\n"
          if "CREATE INDEX home_tax_submission_scope_index" not in migration:
              if marker not in migration:
                  raise SystemExit("HomeTax index anchor drifted")
              index_sql = '''CREATE INDEX home_tax_submission_scope_index
    ON accounting_integration.home_tax_submission (
        tenant_account_id,
        legal_entity_id,
        accounting_book_id,
        fiscal_period_id,
        created_at,
        home_tax_submission_id
    );

'''
              migration = migration.replace(marker, index_sql + marker, 1)
              migration_path.write_text(migration, encoding="utf-8")
          PY
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce coverage and repository contracts
        run: |
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Build and smoke-test wheel
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import accounting_information_platform as aip; assert aip.PostingLedger.__name__ == 'PostingLedger'"
      - name: Publish verified repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr2-command-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce exact accounting command replay"
          git push origin HEAD:agent/accounting-posting-foundation
