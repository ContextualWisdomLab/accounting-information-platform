name: Temporary PR 34 malformed-principal repair

on:
  push:
    branches:
      - feat/purpose-bound-authorization
    paths:
      - .github/workflows/tmp-pr34-malformed-principal-green.yml

permissions:
  contents: write

concurrency:
  group: tmp-pr34-malformed-principal-green
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Prove RED, repair, validate, self-delete
        shell: bash
        env:
          EXPECTED_REF: feat/purpose-bound-authorization
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          if PYTHONPATH=src:. python -m unittest -v \
            tests.test_request_scoped_authorization_context.RequestScopedAuthorizationContextTests.test_malformed_identity_adapter_output_is_fail_closed_before_audit_allow; then
            echo 'Expected malformed-principal regression to be RED before production repair.' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('src/accounting_information_platform/http_api.py')
          text = path.read_text(encoding='utf-8')
          old = '''        resolver = self.server.request_principal_resolver\n        try:\n            principal = None if resolver is None else resolver(self)\n        except Exception:\n            self._write_error(\n                503,\n                'caller identity validation is unavailable. Ask the platform operator to restore the trusted identity adapter, then retry.',\n            )\n            return False\n        decision = authorize(\n            principal,\n            tenant_header,\n            operation_code,\n        )\n'''
          new = '''        resolver = self.server.request_principal_resolver\n        try:\n            principal = None if resolver is None else resolver(self)\n            decision = authorize(\n                principal,\n                tenant_header,\n                operation_code,\n            )\n        except Exception:\n            self._write_error(\n                503,\n                'caller identity validation is unavailable. Ask the platform operator to restore the trusted identity adapter, then retry.',\n            )\n            return False\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected _authorize_request source shape; refusing mutation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          PYTHONPATH=src:. python -m unittest -v tests.test_request_scoped_authorization_context
          PYTHONPATH=src:. python -m unittest -v tests.test_authorization
          PYTHONPATH=src:. python scripts/validate_repository.py .
          python -m compileall -q src tests
          git diff --check

          rm .github/workflows/tmp-pr34-malformed-principal-green.yml
          test ! -e .github/workflows/tmp-pr34-malformed-principal-green.yml
          git diff --check

          git config user.name 'contextualwisdomlab-automation'
          git config user.email 'contextualwisdomlab-automation@users.noreply.github.com'
          git add src/accounting_information_platform/http_api.py \
            .github/workflows/tmp-pr34-malformed-principal-green.yml
          git commit -m 'fix(auth): fail closed on malformed principal output'
          git fetch origin "${EXPECTED_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_REF}"
