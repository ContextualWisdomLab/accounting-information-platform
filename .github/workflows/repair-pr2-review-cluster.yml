name: Repair PR 2 review cluster

on:
  push:
    branches:
      - agent/accounting-posting-foundation

permissions:
  contents: write

concurrency:
  group: repair-pr2-review-cluster
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/accounting-posting-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Apply bounded review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              write(path, text.replace(old, new, 1))

          # RFC 9110 Content-Length syntax: ASCII digits only. Python int() also
          # accepts signs, underscores, whitespace, and non-ASCII digits.
          replace_once(
              "src/accounting_information_platform/http_api.py",
              '''        length_text = self.headers.get("Content-Length", "0")
                  try:
                      length = int(length_text)
                  except ValueError:
                      return b""
          ''',
              '''        length_text = self.headers.get("Content-Length", "0")
                  if re.fullmatch(r"[0-9]+", length_text) is None:
                      return b""
                  length = int(length_text)
          ''',
          )

          # Review-owned HTTP servers and delegated unittest cases must always
          # clean up even when an assertion fails.
          path = "tests/test_http_api.py"
          text = read(path)
          if "import io\n" not in text:
              text = text.replace("import http.client\n", "import http.client\nimport io\n", 1)
          if "from unittest import mock\n" not in text:
              text = text.replace("import unittest\n", "import unittest\nfrom unittest import mock\n", 1)
          if "JournalProposalHandler" not in text:
              text = text.replace(
                  "from accounting_information_platform import AccountingValidationError\n",
                  "from accounting_information_platform import AccountingValidationError\n"
                  "from accounting_information_platform.http_api import JournalProposalHandler\n",
                  1,
              )
          text = text.replace(
              "        self.case.setUp()\n",
              "        self.case.setUp()\n"
              "        self.addCleanup(self.case.doCleanups)\n"
              "        self.addCleanup(self.case.tearDown)\n",
          )
          text = re.sub(
              r"(?m)^(\s*)server = ([^\n]*_start_http_server\(\))\n(?!\1self\.addCleanup)",
              r"\1server = \2\n\1self.addCleanup(server.server_close)\n\1self.addCleanup(server.shutdown)\n",
              text,
          )
          text = re.sub(r"(?m)^\s*server\.shutdown\(\)\n", "", text)
          text = re.sub(r"(?m)^\s*server\.server_close\(\)\n", "", text)
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit("tests/test_http_api.py: main marker missing")
          content_length_test = '''

          class StrictContentLengthSyntaxTests(unittest.TestCase):
              """HTTP body reads reject Python-only integer spellings."""

              def test_read_body_accepts_ascii_digits_only(self) -> None:
                  """Signs, underscores, whitespace, and Unicode digits are not field syntax."""
                  for value in ("+2", "1_0", " 2", "٢"):
                      with self.subTest(value=value):
                          handler = object.__new__(JournalProposalHandler)
                          handler.headers = {"Content-Length": value}
                          handler.rfile = io.BytesIO(b"{}")
                          handler._write_error = mock.Mock()
                          self.assertEqual(handler._read_body(), b"")
                          handler._write_error.assert_not_called()

                  present = object.__new__(JournalProposalHandler)
                  present.headers = {"Content-Length": "2"}
                  present.rfile = io.BytesIO(b"{}")
                  present._write_error = mock.Mock()
                  self.assertEqual(present._read_body(), b"{}")
                  present._write_error.assert_not_called()

                  empty = object.__new__(JournalProposalHandler)
                  empty.headers = {"Content-Length": "0"}
                  empty.rfile = io.BytesIO(b"")
                  empty._write_error = mock.Mock()
                  self.assertEqual(empty._read_body(), b"")
                  empty._write_error.assert_not_called()

                  oversized = object.__new__(JournalProposalHandler)
                  oversized.headers = {"Content-Length": "1048577"}
                  oversized.rfile = io.BytesIO(b"")
                  oversized._write_error = mock.Mock()
                  self.assertIsNone(oversized._read_body())
                  oversized._write_error.assert_called_once()
          '''
          if "class StrictContentLengthSyntaxTests" not in text:
              text = text.replace(marker, content_length_test + marker, 1)
          write(path, text)

          # APA 7th same-author/same-year suffixes.
          path = "docs/doctoring/REFERENCES.md"
          text = read(path)
          text = text.replace(
              "Korea Legislation Research Institute. (2024). *Value-Added Tax Act*.",
              "Korea Legislation Research Institute. (2024a). *Value-Added Tax Act*.",
          )
          text = text.replace(
              "Korea Legislation Research Institute. (2024). *Income Tax Act*.",
              "Korea Legislation Research Institute. (2024b). *Income Tax Act*.",
          )
          write(path, text)

          # Append-only migrations also reject TRUNCATE, DROP TABLE, and quoted
          # journal identifiers rather than only simple UPDATE/DELETE spellings.
          path = "scripts/validate_repository.py"
          text = read(path)
          old = '''APPEND_ONLY_JOURNAL_MUTATION_ERROR = (
              "accounting migrations must not UPDATE or DELETE "
              "general_journal or journal_entry_line"
          )
          APPEND_ONLY_JOURNAL_MUTATION_PATTERN = re.compile(
              r"\\b(?:UPDATE(?:\\s+ONLY)?|DELETE\\s+FROM(?:\\s+ONLY)?)\\s+"
              r"(?:(?:[A-Za-z_][A-Za-z0-9_]*)\\.)?(?:general_journal|journal_entry_line)\\b",
              re.IGNORECASE,
          )
          '''
          new = '''APPEND_ONLY_JOURNAL_MUTATION_ERROR = (
              "accounting migrations must not UPDATE, DELETE, TRUNCATE, or DROP TABLE "
              "general_journal or journal_entry_line"
          )
          _SQL_IDENTIFIER = r'(?:"(?:[^"]|"")*"|[A-Za-z_][A-Za-z0-9_]*)'
          APPEND_ONLY_JOURNAL_MUTATION_PATTERN = re.compile(
              rf"\\b(?:"
              rf"UPDATE(?:\\s+ONLY)?|"
              rf"DELETE\\s+FROM(?:\\s+ONLY)?|"
              rf"TRUNCATE(?:\\s+TABLE)?(?:\\s+ONLY)?|"
              rf"DROP\\s+TABLE(?:\\s+IF\\s+EXISTS)?"
              rf")\\s+"
              rf"(?:{_SQL_IDENTIFIER}\\s*\\.\\s*)?"
              rf'(?:general_journal|journal_entry_line|"general_journal"|"journal_entry_line")'
              rf"(?=\\s|;|$)",
              re.IGNORECASE,
          )
          '''
          if old not in text:
              raise SystemExit("append-only validator snippet drifted")
          text = text.replace(old, new, 1)
          text = text.replace(
              '"""Reject UPDATE or DELETE of posted journal tables in migrations."""',
              '"""Reject destructive mutation of posted journal tables in migrations."""',
              1,
          )
          write(path, text)

          path = "tests/test_repository_contracts.py"
          text = read(path)
          old = '''        forbidden_statements = (
                      "UPDATE accounting_core.general_journal SET journal_status_code = 'posted';",
                      "UPDATE journal_entry_line SET debit_amount = 0;",
                      "UPDATE ONLY general_journal SET journal_status_code = 'posted';",
                      "DELETE FROM accounting_core.journal_entry_line;",
                      "DELETE FROM general_journal;",
                      "DELETE FROM ONLY journal_entry_line;",
                  )
          '''
          new = '''        forbidden_statements = (
                      "UPDATE accounting_core.general_journal SET journal_status_code = 'posted';",
                      "UPDATE journal_entry_line SET debit_amount = 0;",
                      "UPDATE ONLY general_journal SET journal_status_code = 'posted';",
                      "DELETE FROM accounting_core.journal_entry_line;",
                      "DELETE FROM general_journal;",
                      "DELETE FROM ONLY journal_entry_line;",
                      "TRUNCATE accounting_core.general_journal;",
                      "TRUNCATE TABLE ONLY accounting_core.journal_entry_line;",
                      "DROP TABLE accounting_core.general_journal;",
                      'DROP TABLE IF EXISTS "accounting_core"."journal_entry_line" CASCADE;',
                      'UPDATE "accounting_core"."general_journal" SET journal_status_code = \'posted\';',
                  )
          '''
          if old not in text:
              raise SystemExit("append-only test snippet drifted")
          write(path, text.replace(old, new, 1))

          # Operator configuration must never turn loopback/link-local origins
          # into a trusted Billing destination.
          path = "src/accounting_information_platform/billing_pull.py"
          text = read(path)
          if "import ipaddress\n" not in text:
              text = text.replace("import http.client\n", "import http.client\nimport ipaddress\n", 1)
          anchor = '''def _configured_billing_bases() -> tuple[tuple[str, str], ...]:
              """Map operator-configured origins to the fetch base they authorize."""
          '''
          helper = '''def _require_safe_configured_billing_origin(origin: str) -> None:
              """Reject loopback and link-local hosts even when an operator lists them."""
              hostname = urlparse(origin).hostname or ""
              if hostname.lower() == "localhost":
                  raise AccountingValidationError(
                      "Billing configured origins must not use loopback or link-local hosts. "
                      "Set BILLING_BASE_URL to a routable Billing service, then retry the pull."
                  )
              try:
                  address = ipaddress.ip_address(hostname)
              except ValueError:
                  return
              if address.is_loopback or address.is_link_local:
                  raise AccountingValidationError(
                      "Billing configured origins must not use loopback or link-local hosts. "
                      "Set BILLING_BASE_URL to a routable Billing service, then retry the pull."
                  )


          '''
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit("billing configured origin anchor drifted")
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
              "        origin = _canonical_billing_origin(fetch_base)\n",
              "        origin = _canonical_billing_origin(fetch_base)\n"
              "        _require_safe_configured_billing_origin(origin)\n",
              1,
          )
          write(path, text)

          path = "tests/test_billing_pull.py"
          text = read(path)
          old = '''                loopback_env = dict(env)
                          loopback_env["BILLING_BASE_URL"] = "http://127.0.0.1:18765"
                          with mock.patch.dict(os.environ, loopback_env, clear=False):
                              allowlisted_loopback = _accept_pull(
                                  _pull_payload("http://127.0.0.1:18765")
                              )
          '''
          if old not in text:
              raise SystemExit("loopback success fixture drifted")
          text = text.replace(old, "", 1)
          text = text.replace(
              "        self.assertEqual(allowlisted_loopback, omitted)\n",
              "",
              1,
          )
          text = text.replace(
              '''                _DR_ORIGIN,
                          "http://127.0.0.1:18765",
          ''',
              '''                _DR_ORIGIN,
          ''',
              1,
          )
          text = text.replace(
              '"BILLING_ALLOWED_ORIGINS": "http://[fe80::1]:18765",',
              '"BILLING_ALLOWED_ORIGINS": "http://[2001:4860:4860::8888]:18765",',
              1,
          )
          text = text.replace(
              '_accept_pull(_pull_payload("http://[fe80::1]:18765"))',
              '_accept_pull(_pull_payload("http://[2001:4860:4860::8888]:18765"))',
              1,
          )
          text = text.replace(
              '"http://[fe80::1]:18765",',
              '"http://[2001:4860:4860::8888]:18765",',
              1,
          )
          marker = '\n\nif __name__ == "__main__":\n'
          configured_test = '''

              def test_configured_loopback_and_link_local_origins_fail_closed(self) -> None:
                  """Neither primary nor additional configured origins may target local networks."""
                  unsafe_environments = (
                      {
                          "BILLING_BASE_URL": "http://127.0.0.1:18765",
                          "BILLING_ALLOWED_ORIGINS": _DR_ORIGIN,
                      },
                      {
                          "BILLING_BASE_URL": _BILLING_ORIGIN,
                          "BILLING_ALLOWED_ORIGINS": "http://169.254.169.254,http://[fe80::1]",
                      },
                      {
                          "BILLING_BASE_URL": "http://localhost:18765",
                          "BILLING_ALLOWED_ORIGINS": "",
                      },
                  )
                  with mock.patch(
                      "accounting_information_platform.billing_pull.pull_validated_journal_proposals"
                  ) as pull:
                      for environment in unsafe_environments:
                          with self.subTest(environment=environment):
                              with mock.patch.dict(os.environ, environment, clear=False):
                                  with self.assertRaisesRegex(
                                      AccountingValidationError, "loopback or link-local"
                                  ):
                                      _accept_pull(_pull_payload())
                              pull.assert_not_called()

                  with mock.patch.dict(
                      os.environ,
                      {
                          "BILLING_BASE_URL": "https://8.8.8.8",
                          "BILLING_ALLOWED_ORIGINS": "",
                      },
                      clear=False,
                  ):
                      with mock.patch(
                          "accounting_information_platform.billing_pull.pull_validated_journal_proposals",
                          return_value=JournalProposalPage((), None),
                      ) as safe_pull:
                          self.assertEqual(
                              _accept_pull(_pull_payload()),
                              {"posting_receipts": [], "rejected_proposals": []},
                          )
                          safe_pull.assert_called_once()
          '''
          class_end = '\n\nif __name__ == "__main__":\n'
          if "test_configured_loopback_and_link_local_origins_fail_closed" not in text:
              if class_end not in text:
                  raise SystemExit("tests/test_billing_pull.py: main marker missing")
              # Keep the new method inside BillingPullOriginAllowlistTests.
              text = text.replace(class_end, configured_test + class_end, 1)
          write(path, text)
          PY
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Run behavior tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run complete production branch coverage
        env:
          PYTHONPATH: src:.
        run: python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce complete coverage and repository contracts
        run: |
          python -m coverage report --fail-under=100 --show-missing
          python scripts/validate_repository.py .
          python -m compileall -q src scripts tests
      - name: Remove one-shot workflow and publish repair
        run: |
          rm .github/workflows/repair-pr2-review-cluster.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close accounting review safety gaps"
          git push origin HEAD:agent/accounting-posting-foundation
