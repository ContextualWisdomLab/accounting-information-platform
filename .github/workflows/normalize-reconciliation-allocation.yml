name: Normalize reconciliation allocation persistence

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: normalize-reconciliation-allocation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/reconciliation-allocation-persistence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Apply bounded GREEN normalization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_reconciliation_allocation_persistence.py
          rm .github/workflows/normalize-reconciliation-allocation.yml
          rm scripts/repair_reconciliation_allocation_persistence.py
          git diff --check
      - name: Publish canonical repaired head
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'repair produced no changes' >&2; exit 1; }
          git commit -m 'feat: persist reconciliation allocation evidence'
          git push origin "HEAD:${HEAD_REF}"
