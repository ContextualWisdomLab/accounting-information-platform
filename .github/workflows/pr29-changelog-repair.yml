name: PR29 changelog repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/pr29-changelog-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/reconciliation-multi-match-conservation
          fetch-depth: 0
      - name: Repair CHANGELOG and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          old = "- Added durable reconciliation candidate, match, and allocation rows (`reconciliation_candidate`, `reconciliation_match`, `statement_match_allocation`, `journal_match_allocation`) with forced tenant row-level security and exact positive amounts. Append-only migration `0015_reconciliation_multi_match_conservation.sql` replaces the earlier run-wide single-approved-match shortcut with tenant/run-scoped identity and exact statement/journal allocation conservation, allowing multiple independent approved matches without double-consuming authoritative source amounts. Allocations remain reviewed evidence with no posting, reversal, close, or accounting-policy authority. ADR 0054 records the boundary."
          new = "- Added durable reconciliation candidate, match, and allocation rows (`reconciliation_candidate`, `reconciliation_match`, `statement_match_allocation`, `journal_match_allocation`) with forced tenant row-level security and exact positive amounts. Append-only migration `0015_reconciliation_multi_match_conservation.sql` replaces the earlier run-wide single-approved-match shortcut with tenant/run-scoped identity and exact statement/journal allocation conservation, allowing multiple independent approved matches without double-consuming authoritative source amounts. Approval requires non-empty statement allocations, non-empty journal allocations, and exactly equal approved statement/journal allocation totals. Allocations remain reviewed evidence with no posting, reversal, close, or accounting-policy authority. ADR 0054 records the boundary."
          if text.count(old) != 1:
              raise SystemExit('expected exactly one migration-0015 CHANGELOG bullet')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/pr29-changelog-repair.yml
          git diff --check
          git config user.name 'ContextualWisdomLab repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: record balanced reconciliation approval invariant'
          git push origin HEAD:fix/reconciliation-multi-match-conservation
