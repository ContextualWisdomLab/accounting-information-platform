name: Temporary readiness definition repair

on:
  push:
    branches:
      - feat/operability-readiness-baseline
    paths:
      - .github/workflows/aip-temporary-definition-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      PYTHONPATH: src:.
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: feat/operability-readiness-baseline
          fetch-depth: 1
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked repository dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Generate canonical PostgreSQL 18 definition fingerprints
        run: python scripts/aip_temporary_definition_repair.py
      - name: Compile repaired production module
        run: python -m compileall -q src/accounting_information_platform/persistence.py
      - name: Normalize repair and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aip-temporary-definition-repair.yml
          git rm scripts/aip_temporary_definition_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/accounting_information_platform/persistence.py
          git commit -m "fix: validate readiness object definitions"
          git push origin HEAD:feat/operability-readiness-baseline
