name: Temporary PR29 install-chain repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/tmp-pr29-install-chain-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: fix/reconciliation-multi-match-conservation
          fetch-depth: 0
      - name: Apply canonical migration-chain repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement site in {path}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Canonical persistence loader must install the checked-in 0017 repair.
          replace_once(
              "src/accounting_information_platform/persistence.py",
              '''    approval_migration_path = (\n        migration_path.parent / "0016_reconciliation_approval_evidence.sql"\n    )\n    if not approval_migration_path.is_file():\n        raise AccountingValidationError(\n            "Reconciliation approval-evidence migration is missing at "\n            f"{approval_migration_path}. Restore "\n            "database/migrations/0016_reconciliation_approval_evidence.sql, then retry."\n        )\n    psycopg = _import_psycopg()\n''',
              '''    approval_migration_path = (\n        migration_path.parent / "0016_reconciliation_approval_evidence.sql"\n    )\n    if not approval_migration_path.is_file():\n        raise AccountingValidationError(\n            "Reconciliation approval-evidence migration is missing at "\n            f"{approval_migration_path}. Restore "\n            "database/migrations/0016_reconciliation_approval_evidence.sql, then retry."\n        )\n    approval_lock_order_migration_path = (\n        migration_path.parent / "0017_reconciliation_approval_lock_order.sql"\n    )\n    if not approval_lock_order_migration_path.is_file():\n        raise AccountingValidationError(\n            "Reconciliation approval lock-order migration is missing at "\n            f"{approval_lock_order_migration_path}. Restore "\n            "database/migrations/0017_reconciliation_approval_lock_order.sql, then retry."\n        )\n    psycopg = _import_psycopg()\n''',
          )
          replace_once(
              "src/accounting_information_platform/persistence.py",
              '''            connection.execute(approval_migration_path.read_text(encoding="utf-8"))\n''',
              '''            connection.execute(approval_migration_path.read_text(encoding="utf-8"))\n            connection.execute(\n                approval_lock_order_migration_path.read_text(encoding="utf-8")\n            )\n''',
          )

          # Repository manifest and operator docs must name the same latest migration.
          replace_once(
              "scripts/validate_repository.py",
              '''    "database/migrations/0016_reconciliation_approval_evidence.sql",\n''',
              '''    "database/migrations/0016_reconciliation_approval_evidence.sql",\n    "database/migrations/0017_reconciliation_approval_lock_order.sql",\n''',
          )
          replace_once(
              "README.md",
              "through `database/migrations/0016_reconciliation_approval_evidence.sql`",
              "through `database/migrations/0017_reconciliation_approval_lock_order.sql`",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              '''16. `database/migrations/0016_reconciliation_approval_evidence.sql` — records immutable human reconciliation decisions and object-storage source-payload provenance, binds them to a database-computed candidate/allocation snapshot before a match can become terminal, and refuses unbound legacy terminal rows during upgrade.\n''',
              '''16. `database/migrations/0016_reconciliation_approval_evidence.sql` — records immutable human reconciliation decisions and object-storage source-payload provenance, binds them to a database-computed candidate/allocation snapshot before a match can become terminal, and refuses unbound legacy terminal rows during upgrade.\n17. `database/migrations/0017_reconciliation_approval_lock_order.sql` — makes approval evidence insertion use the same parent-match-row → snapshot-advisory lock order as allocation insertion and terminal match transition, eliminating the approval/allocation lock inversion without changing reconciliation or posting authority.\n''',
          )
          replace_once(
              "docs/OPERABILITY.md",
              "Apply migrations in numeric order through `0016_reconciliation_approval_evidence.sql` before starting the service.",
              "Apply migrations in numeric order through `0017_reconciliation_approval_lock_order.sql` before starting the service.",
          )
          replace_once(
              "docs/OPERABILITY.md",
              '''database/migrations/0016_reconciliation_approval_evidence.sql\n```\n''',
              '''database/migrations/0016_reconciliation_approval_evidence.sql\ndatabase/migrations/0017_reconciliation_approval_lock_order.sql\n```\n''',
          )
          replace_once(
              "docs/OPERABILITY.md",
              '''Migration `0016_reconciliation_approval_evidence.sql` adds immutable tenant/run/match-scoped human approval evidence. Operators first record the reviewed approval command identity, immutable object-storage source-payload hash/reference, approver and purpose, then transition the proposed match to `approved`; PostgreSQL computes and stores a SHA-256 snapshot of the candidate/allocation rows, rejects status-only or stale-snapshot approval, freezes candidate identity and later allocations, and refuses installation over existing non-proposed matches without durable approval evidence. Approval evidence grants no journal-posting, reversal, close, or policy authority.\n''',
              '''Migration `0016_reconciliation_approval_evidence.sql` adds immutable tenant/run/match-scoped human approval evidence. Operators first record the reviewed approval command identity, immutable object-storage source-payload hash/reference, approver and purpose, then transition the proposed match to `approved`; PostgreSQL computes and stores a SHA-256 snapshot of the candidate/allocation rows, rejects status-only or stale-snapshot approval, freezes candidate identity and later allocations, and refuses installation over existing non-proposed matches without durable approval evidence. Approval evidence grants no journal-posting, reversal, close, or policy authority.\n\nMigration `0017_reconciliation_approval_lock_order.sql` repairs the approval/allocation concurrency boundary without broadening authority. Approval INSERT, allocation INSERT, and terminal match UPDATE acquire the parent `reconciliation_match` row before the per-match snapshot advisory lock when both are needed. A concurrent command must wait or fail with its stable accounting-control error; `deadlock detected` is not an accepted reconciliation outcome.\n''',
          )

          # Data model and ADR must describe the installed row -> advisory order.
          replace_once(
              "docs/DATA_MODEL.md",
              "Migrations `0013_reconciliation_run_exception_evidence.sql` through `0016_reconciliation_approval_evidence.sql` persist deterministic reconciliation as accounting control evidence without granting posting, reversal, close, or accounting-policy authority.",
              "Migrations `0013_reconciliation_run_exception_evidence.sql` through `0017_reconciliation_approval_lock_order.sql` persist deterministic reconciliation as accounting control evidence without granting posting, reversal, close, or accounting-policy authority.",
          )
          replace_once(
              "docs/DATA_MODEL.md",
              "Approval and allocation transitions share a match-level advisory lock, and allocations plus candidate identity are frozen once approval evidence exists, so the durable decision cannot authorize a changed proposed state.",
              "Approval, allocation, and terminal transitions share a match-level advisory lock; when a path also needs the parent match row, migration 0017 normalizes acquisition to parent row first and snapshot advisory lock second. Allocations plus candidate identity are frozen once approval evidence exists, so the durable decision cannot authorize a changed proposed state.",
          )
          replace_once(
              "docs/adr/0055-reconciliation-approval-snapshot-binding.md",
              '''Approval, allocation, and terminal match transitions share the same\ntransaction-level advisory lock for the tenant/run/match identity. Allocation\ninserts and terminal match updates additionally serialize on the parent\n`reconciliation_match` row and acquire those locks in one database-owned order:\nparent row first, snapshot advisory lock second. Approval-evidence insertion\ntakes only the snapshot advisory lock and never subsequently waits on the parent\nrow, so it cannot complete a row/advisory wait cycle. Before an `approved`\n''',
              '''Approval, allocation, and terminal match transitions share the same\ntransaction-level advisory lock for the tenant/run/match identity. Migration\n`0017_reconciliation_approval_lock_order.sql` normalizes every path that also\nneeds the parent `reconciliation_match` row to one database-owned order: parent\nrow first, snapshot advisory lock second. Approval-evidence insertion explicitly\nlocks the proposed parent match before taking the snapshot advisory lock, so its\nforeign-key check cannot later invert the allocation path's row/advisory order.\nBefore an `approved`\n''',
          )
          replace_once(
              "docs/adr/0055-reconciliation-approval-snapshot-binding.md",
              '''The lock-order regression uses two real PostgreSQL connections and\n`pg_blocking_pids()` as a barrier rather than a timing sleep. It first reproduced\nthe row/advisory deadlock when allocation insertion acquired the snapshot lock\nbefore the parent row. The repaired allocation path acquires the parent match\nrow before the snapshot advisory lock, so an invalid terminal transition fails\nwith the stable accounting-control error and the waiting valid allocation then\ncontinues instead of receiving `deadlock detected`.\n''',
              '''The lock-order regressions use real PostgreSQL connections and\n`pg_blocking_pids()` barriers rather than timing sleeps. They first reproduced\nthe row/advisory deadlock when allocation insertion acquired the snapshot lock\nbefore the parent row, then separately reproduced the approval-INSERT versus\nallocation-INSERT cycle caused by approval taking the advisory lock before its\nforeign-key row lock. The installed chain through migration 0017 makes both\npaths acquire the parent match row before the snapshot advisory lock, so the\ncompeting command waits or receives the stable accounting-control error instead\nof `deadlock detected`.\n''',
          )

          # Standards traceability and changelog must identify the executable repair.
          replace_once(
              "docs/doctoring/STANDARD_TRACEABILITY.md",
              "while migration 0016 binds approval to the database-owned candidate/allocation snapshot and freezes late allocations.",
              "while migration 0016 binds approval to the database-owned candidate/allocation snapshot and freezes late allocations; migration 0017 then normalizes approval/allocation/terminal lock acquisition to parent match row before snapshot advisory lock where both locks are required.",
          )
          replace_once(
              "docs/doctoring/STANDARD_TRACEABILITY.md",
              "`0016_reconciliation_approval_evidence.sql`, real PostgreSQL snapshot regression, ADR 0055, PostgreSQL binary-string, trigger, and transaction-isolation documentation",
              "`0016_reconciliation_approval_evidence.sql`, `0017_reconciliation_approval_lock_order.sql`, real PostgreSQL snapshot/lock-order regressions, ADR 0055, PostgreSQL binary-string, trigger, row-lock, advisory-lock, and transaction-isolation documentation",
          )
          replace_once(
              "CHANGELOG.md",
              "This control evidence cannot post, reverse, close, or alter accounting policy. ADR 0055 records the decision.",
              "Migration `0017_reconciliation_approval_lock_order.sql` additionally makes approval INSERT use the same parent-row → snapshot-advisory lock order as allocation INSERT and terminal match UPDATE, preventing the verified approval/allocation deadlock without broadening authority. This control evidence cannot post, reverse, close, or alter accounting policy. ADR 0055 records the decision.",
          )

          # Add explicit install-chain contracts for the repair migration.
          test_path = Path("tests/test_foundation_install_manifest_contract.py")
          text = test_path.read_text(encoding="utf-8")
          anchor = '''    def test_install_fails_closed_when_approval_snapshot_migration_is_missing(self) -> None:\n'''
          if anchor not in text:
              raise SystemExit("foundation install contract anchor not found")
          addition = '''    def test_required_files_and_install_docs_include_approval_lock_order(self) -> None:\n        """Approval lock-order repair must be the canonical migration after approval evidence."""\n        migration_sixteen = "database/migrations/0016_reconciliation_approval_evidence.sql"\n        migration_seventeen = "database/migrations/0017_reconciliation_approval_lock_order.sql"\n        self.assertIn(migration_seventeen, set(REQUIRED_FILES))\n        for relative_path in ("docs/OPERABILITY.md", "docs/ARCHITECTURE.md"):\n            with self.subTest(relative_path=relative_path):\n                text = (ROOT / relative_path).read_text(encoding="utf-8")\n                self.assertIn(migration_sixteen, text)\n                self.assertIn(migration_seventeen, text)\n                self.assertLess(text.index(migration_sixteen), text.index(migration_seventeen))\n\n    def test_install_fails_closed_when_approval_lock_order_migration_is_missing(self) -> None:\n        """The canonical loader may not stop before the approval/allocation lock-order repair."""\n        original_is_file = Path.is_file\n\n        def is_file(path: Path) -> bool:\n            if path.name == "0017_reconciliation_approval_lock_order.sql":\n                return False\n            return original_is_file(path)\n\n        with patch.object(Path, "is_file", is_file):\n            with self.assertRaises(AccountingValidationError):\n                apply_foundation_migration(\n                    "postgresql://unused",\n                    ROOT / "database/migrations/0001_accounting_foundation.sql",\n                )\n\n'''
          if "test_required_files_and_install_docs_include_approval_lock_order" in text:
              raise SystemExit("0017 install contract already present")
          test_path.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

          # Remove temporary machinery from the durable product-tree commit.
          Path(".github/workflows/tmp-pr29-install-chain-repair.yml").unlink()
          PY

          git diff --check
          PYTHONPATH=src:. python -m unittest -q \
            tests.test_foundation_install_manifest_contract \
            tests.test_repository_contracts \
            tests.test_reconciliation_lock_order_red.ReconciliationRecoveryCopyContractTests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install reconciliation approval lock-order migration"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
