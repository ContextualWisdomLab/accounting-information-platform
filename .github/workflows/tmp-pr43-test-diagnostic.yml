name: PR43 behavior-test diagnostic

on:
  push:
    branches:
      - feat/reconciliation-run-lifecycle-transition

permissions:
  contents: read

concurrency:
  group: pr43-behavior-test-diagnostic
  cancel-in-progress: true

jobs:
  behavior-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCOUNTING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install hash-locked quality dependencies
        run: >-
          python -m pip install --require-hashes
          --disable-pip-version-check
          --only-binary=:all:
          -r requirements-quality.txt
      - name: Run behavior tests and capture exact output
        id: behavior
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -uo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "${RUNNER_TEMP}/pr43-behavior-tests.log"
          exit "${PIPESTATUS[0]}"
      - name: Upload behavior-test diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr43-behavior-test-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/pr43-behavior-tests.log
          if-no-files-found: error
          retention-days: 1
