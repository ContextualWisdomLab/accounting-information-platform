name: PR29 current-review repair

on:
  push:
    branches:
      - fix/reconciliation-multi-match-conservation
    paths:
      - .github/workflows/pr29-current-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0f65ae23ee316a97c36a4a6817cdebac4aeaab8d"

      - name: Apply reviewed causal repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/accounting_information_platform/http_api.py",
              '    if "must be a UUID" in message or "is required" in message:\n        return 400\n',
              '    if "must be a UUID" in message:\n        return 400\n',
          )

          read_model = "src/accounting_information_platform/reconciliation_read_model.py"
          replace_once(
              read_model,
              '        covered_journal_sources: set[str] = set()\n        for decision in decisions:\n',
              '        covered_statement_sources: set[str] = set()\n        covered_journal_sources: set[str] = set()\n        for decision in decisions:\n',
          )
          replace_once(
              read_model,
              '            decision_journal_sources = set(decision.matched_journal_references)\n',
              '            covered_statement_sources.add(decision.statement_entry_reference)\n            decision_journal_sources = set(decision.matched_journal_references)\n',
          )
          replace_once(
              read_model,
              '        if covered_journal_sources != journal_sources:\n            raise ValueError(\n                "reviewed match evidence must cover every normalized journal allocation"\n            )\n',
              '        if covered_statement_sources != statement_sources:\n            raise ValueError(\n                "reviewed match evidence must cover every normalized statement allocation"\n            )\n        if covered_journal_sources != journal_sources:\n            raise ValueError(\n                "reviewed match evidence must cover every normalized journal allocation"\n            )\n',
          )

          replace_once(
              "tests/test_reconciliation_run_api.py",
              '        self.assertEqual(missing_policy_status, 400)\n',
              '        self.assertEqual(missing_policy_status, 422)\n',
          )

          current_red = "tests/test_current_head_review_regressions_red.py"
          replace_once(
              current_red,
              'import accounting_information_platform.reconciliation_read_model as read_model\nfrom accounting_information_platform.reconciliation_read_model import (\n',
              'from accounting_information_platform.reconciliation_read_model import (\n    build_reconciliation_close_review,\n',
          )
          replace_once(
              current_red,
              '            read_model.build_reconciliation_close_review(projection_input)\n',
              '            build_reconciliation_close_review(projection_input)\n',
          )

          manifest_test = "tests/test_foundation_install_manifest_contract.py"
          replace_once(
              manifest_test,
              '''        for relative_path in ("docs/OPERABILITY.md", "docs/ARCHITECTURE.md"):\n            with self.subTest(relative_path=relative_path):\n                text = (ROOT / relative_path).read_text(encoding="utf-8")\n                self.assertIn(migration_eighteen, text)\n                self.assertIn(migration_nineteen, text)\n                self.assertLess(text.index(migration_eighteen), text.index(migration_nineteen))\n''',
              '''        for relative_path in ("docs/OPERABILITY.md", "docs/ARCHITECTURE.md"):\n            with self.subTest(relative_path=relative_path):\n                text = (ROOT / relative_path).read_text(encoding="utf-8")\n                if relative_path == "docs/OPERABILITY.md":\n                    install_section = text.split("## Database installation", 1)[1]\n                    install_block = install_section.split("```text", 1)[1].split("```", 1)[0]\n                else:\n                    install_section = text.split("## Persistence and migration order", 1)[1]\n                    install_block = install_section.split("`0005_closed_period_guard.sql` makes", 1)[0]\n                self.assertIn(migration_eighteen, install_block)\n                self.assertIn(migration_nineteen, install_block)\n                self.assertLess(\n                    install_block.index(migration_eighteen),\n                    install_block.index(migration_nineteen),\n                )\n''',
          )

          replace_once(
              "tests/test_operability_documentation_contract.py",
              '''        operability = (ROOT / "docs" / "OPERABILITY.md").read_text(encoding="utf-8")\n\n        self.assertIn("reconciliation-run command", operability)\n''',
              '''        operability = " ".join(\n            (ROOT / "docs" / "OPERABILITY.md").read_text(encoding="utf-8").split()\n        )\n\n        self.assertIn(\n            "reconciliation-run commands acquire tenant-scoped transaction advisory locks",\n            operability,\n        )\n''',
          )

          approval_test = "tests/test_reconciliation_close_package_approval_provenance_red.py"
          replace_once(
              approval_test,
              'import unittest\nfrom dataclasses import replace\n',
              'import unittest\nimport unittest.mock as mock\nfrom contextlib import contextmanager\nfrom dataclasses import replace\n',
          )
          replace_once(
              approval_test,
              'from accounting_information_platform.reconciliation_close_package import (\n',
              'from accounting_information_platform import reconciliation_close_package as close_package\nfrom accounting_information_platform.reconciliation_close_package import (\n',
          )
          replace_once(
              approval_test,
              '''    def test_caller_forged_approved_state_reference_is_not_authoritative(self) -> None:\n        """An arbitrary digest plus an approved-shaped label cannot prove live database state."""\n        package_input = self._input()\n        forged_state = tuple(\n            replace(\n                evidence,\n                sha256_digest="sha256:" + "f" * 64,\n            )\n            if evidence.evidence_kind_code == "reconciliation_match_state"\n            else evidence\n            for evidence in package_input.evidence_references\n        )\n        with self.assertRaisesRegex(ValueError, "database-owned match state"):\n            build_authoritative_reconciliation_close_package(\n                replace(package_input, evidence_references=forged_state)\n            )\n''',
              '''    def test_caller_forged_approved_state_reference_is_not_authoritative(self) -> None:\n        """Caller-shaped approved evidence cannot override a superseded database match."""\n        package_input = self._input()\n        forged_state = tuple(\n            replace(evidence, sha256_digest="sha256:" + "f" * 64)\n            if evidence.evidence_kind_code == "reconciliation_match_state"\n            else evidence\n            for evidence in package_input.evidence_references\n        )\n        approval = package_input.approval_evidence[0]\n\n        class Rows:\n            def fetchall(self):\n                return [\n                    (\n                        approval.reconciliation_match_reference,\n                        "superseded",\n                        "approved",\n                        approval.source_payload_hash,\n                        approval.evidence_reference,\n                        approval.reconciliation_snapshot_sha256,\n                    )\n                ]\n\n        class Connection:\n            def execute(self, _query, _parameters):\n                return Rows()\n\n        class Ledger:\n            def __init__(self, _database_url, _tenant_reference):\n                pass\n\n            @contextmanager\n            def _session(self):\n                yield Connection()\n\n            def _require_tenant(self, _connection):\n                return "tenant-id"\n\n        with mock.patch.object(close_package, "PostgresPostingLedger", Ledger):\n            with self.assertRaisesRegex(ValueError, "must remain approved"):\n                build_authoritative_reconciliation_close_package(\n                    replace(package_input, evidence_references=forged_state),\n                    database_url="postgresql://example",\n                    tenant_reference="tenant-1",\n                )\n''',
          )

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          late_start = text.index("8. `database/migrations/0008_fiscal_period_open_command.sql`")
          late_end = text.index("\n## Durable soft-close command evidence", late_start)
          migration_tail = text[late_start:late_end].rstrip() + "\n"
          text = text[:late_start] + text[late_end + 1:]
          insertion = "7. `database/migrations/0007_runtime_tenant_binding.sql` — database-controlled runtime login-to-tenant binding consumed by forced-RLS policy evaluation.\n"
          if text.count(insertion) != 1:
              raise SystemExit("docs/ARCHITECTURE.md: migration insertion anchor changed")
          text = text.replace(insertion, insertion + migration_tail, 1)
          read_anchor = "- fail-closed HomeTax submission evidence and receipt history.\n"
          if text.count(read_anchor) != 1:
              raise SystemExit("docs/ARCHITECTURE.md: read-model anchor changed")
          text = text.replace(
              read_anchor,
              read_anchor
              + "- reconciliation-run command/read APIs (`accept_reconciliation_run`, `lookup_reconciliation_run`) over immutable statement and assignment evidence; these surfaces evaluate/run reconciliation only and never post journals or close periods.\n",
              1,
          )
          architecture.write_text(text, encoding="utf-8")
          PY

      - name: Normalize repair into canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr29-current-review-repair.yml
          git add \
            src/accounting_information_platform/http_api.py \
            src/accounting_information_platform/reconciliation_read_model.py \
            tests/test_reconciliation_run_api.py \
            tests/test_current_head_review_regressions_red.py \
            tests/test_foundation_install_manifest_contract.py \
            tests/test_operability_documentation_contract.py \
            tests/test_reconciliation_close_package_approval_provenance_red.py \
            docs/ARCHITECTURE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address current reconciliation review findings"
          git push origin HEAD:fix/reconciliation-multi-match-conservation
